plugins {
    id "com.android.application"
}

android {
    namespace "de.fvh02.jarvis"
    compileSdk 34

    defaultConfig {
        applicationId "de.fvh02.jarvis"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded on the projector: signed with the build machine's debug key.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
