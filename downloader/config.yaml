name: Fabians-HA-Downloader
version: "1.5.0"
slug: downloader
description: Warteschlange für Datei-Downloads mit moderner Weboberfläche
url: https://github.com/fvh02/Fabians-HA-Addons
image: ghcr.io/fvh02/{arch}-fabians-ha-downloader
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:download-circle
panel_title: Downloader
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Weboberfläche und API im Heimnetz
map:
  - media:rw
  - share:rw
options:
  design: modern
  theme: dark
  download_dir: /media/downloads
schema:
  design: list(modern|terminal)
  theme: list(dark|light)
  download_dir: str
