name: Build add-on images

# Builds every changed add-on once per architecture and publishes it to GHCR, so Home Assistant
# only pulls a ready image instead of building it on the device.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which add-ons changed
        id: plan
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only "$before" "${{ github.sha }}")
            [ ${#changed[@]} -gt 0 ] || changed=(none)
          else
            changed=()   # first push or manual run: build everything
          fi
          matrix="$(python3 tools/build_matrix.py "${changed[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(python3 -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.addon }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Shared files are in sync
        run: |
          for f in */app/fabians_master.py; do cmp shared/fabians_master.py "$f"; done

      # armv7 runs emulated on the arm64 runner
      - if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-fabians-ha-${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.base && format('BUILD_FROM={0}', matrix.base) || '' }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.arch }}
