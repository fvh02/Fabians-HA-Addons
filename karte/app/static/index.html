<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg: #f6f7fb; --card: #fff; --text: #1d2130; --muted: #6b7185; --line: #e3e6ef; --accent: #e8590c; --good: #2f9e44; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11131a; --card: #1b1e28; --text: #eceef5; --muted: #9aa0b4; --line: #2b2f3c; --accent: #ff8a3d; --good: #51cf66; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-rows: 55vh 1fr; height: 100dvh; }
  @media (min-width: 900px) { #app { grid-template-rows: none; grid-template-columns: 1fr 400px; } #side { order: 2; } }
  #map { min-height: 0; }
  #side { overflow: auto; padding: 12px 16px 24px; border-top: 1px solid var(--line); }
  @media (min-width: 900px) { #side { border-top: 0; border-left: 1px solid var(--line); } }
  h1 { font-size: 1.15rem; margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 small { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: auto; }
  input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .item b { display: block; }
  .item .meta { color: var(--muted); font-size: .85rem; }
  .pin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 16px; flex: none; }
  .empty { color: var(--muted); padding: 18px 4px; }
  .sheet { position: fixed; inset: auto 0 0 0; max-height: 88dvh; overflow: auto; background: var(--card); border-radius: 18px 18px 0 0;
           box-shadow: 0 -10px 40px rgba(0,0,0,.25); padding: 16px 16px 28px; z-index: 1000; }
  @media (min-width: 900px) { .sheet { inset: 0 0 0 auto; width: 440px; max-height: none; border-radius: 0; } }
  .sheet h2 { margin: 0 34px 2px 0; font-size: 1.3rem; }
  .close { position: absolute; top: 12px; right: 12px; border: 0; background: var(--line); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .sub { color: var(--muted); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--line); font-size: .85rem; }
  section { margin-top: 16px; }
  section h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .diff { border-left: 3px solid var(--bad); padding: 6px 10px; margin: 6px 0; background: color-mix(in srgb, var(--bad) 8%, transparent); border-radius: 6px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .row span:last-child { white-space: nowrap; color: var(--muted); }
  .visit { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stars button { border: 0; background: none; font-size: 20px; padding: 0 1px; cursor: pointer; color: var(--muted); }
  .stars button.on { color: #f59f00; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: zoom-in; background: var(--line); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 14px; border-radius: 10px; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; z-index: 2000; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 3000; cursor: zoom-out; }
  .zoom img { max-width: 96vw; max-height: 92dvh; border-radius: 8px; }
  .leaflet-container { background: var(--bg); }
  .mk { background: var(--accent); color: #fff; border: 2px solid #fff; border-radius: 50%; display: grid; place-items: center; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="side">
    <h1>🍽️ Meine Karte <small id="count"></small></h1>
    <input id="q" type="search" placeholder="Suchen: Name, Küche, Gericht …" autocomplete="off">
    <div id="list"></div>
    <p class="muted" style="font-size:.85rem;margin-top:18px">Neue Besuche trägt der Assistent ein: schick ihm ein Foto der
      Speisekarte und was du bestellt hast – oder schreib „Bin bei …“.</p>
  </div>
</div>
<div id="sheet" class="sheet hidden"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = p => p == null ? "" : p.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const day = t => new Date(t * 1000).toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" });
const ICON = { restaurant: "🍽️", cafe: "☕", fast_food: "🍔", bar: "🍸", pub: "🍺", biergarten: "🍺", ice_cream: "🍦", food_court: "🍱" };
const icon = k => ICON[k] || "📍";
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Fehler ${r.status}`);
  return data;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }

const map = L.map("map", { zoomControl: true }).setView([51.2, 10.4], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
let places = [], current = null, first = true;

async function load() {
  const q = $("q").value.trim();
  places = (await api("api/orte" + (q ? "?suche=" + encodeURIComponent(q) : ""))).orte;
  $("count").textContent = places.length ? `${places.length} Orte` : "";
  layer.clearLayers();
  for (const p of places) {
    const m = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: `<div class="mk" style="width:30px;height:30px">${icon(p.kind)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) });
    m.on("click", () => open(p.id));
    m.bindTooltip(p.name);
    m.addTo(layer);
  }
  if (first && places.length) { map.fitBounds(places.map(p => [p.lat, p.lon]), { padding: [40, 40], maxZoom: 15 }); first = false; }
  $("list").innerHTML = places.length ? places.map(p => `
    <div class="item" data-id="${p.id}"><div class="pin">${icon(p.kind)}</div><div>
      <b>${esc(p.name)}</b>
      <div class="meta">${esc([p.cuisine, p.price_level, p.rating ? "Du: " + p.rating + "★" : "", p.online_rating ? "online " + p.online_rating + "★" : "",
        p.visits ? p.visits + "× da" : "", p.last_visit ? "zuletzt " + day(p.last_visit) : ""].filter(Boolean).join(" · "))}
        ${p.differences ? ` · <span style="color:var(--bad)">${p.differences} Abweichung${p.differences > 1 ? "en" : ""}</span>` : ""}</div>
    </div></div>`).join("") : `<div class="empty">${q ? "Nichts gefunden." : "Noch keine Orte – der Assistent trägt deinen ersten Restaurantbesuch ein."}</div>`;
  for (const el of document.querySelectorAll(".item")) el.onclick = () => open(+el.dataset.id);
}

function stars(visitId, value) {
  return `<span class="stars" data-visit="${visitId}">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}" class="${value >= n ? "on" : ""}" aria-label="${n} Sterne">★</button>`).join("")}</span>`;
}

async function open(id) {
  const p = current = await api("api/ort/" + id);
  map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15));
  const o = p.online || {}, menu = p.from_menu || {};
  const sections = {};
  for (const d of p.dishes) (sections[d.section || "Speisekarte"] ||= []).push(d);
  const checkText = p.check === "läuft" ? "Abgleich läuft …" : p.check && p.check.startsWith("Fehler") ? p.check
    : p.checked_at ? "Online abgeglichen am " + day(p.checked_at) : "Noch nicht online abgeglichen";
  $("sheet").innerHTML = `
    <button class="close" id="close" aria-label="Schließen">×</button>
    <h2>${icon(p.kind)} ${esc(p.name)}</h2>
    <div class="sub">${esc(p.address)}</div>
    <div class="chips">${[p.cuisine, o.preisniveau, p.rating ? "Du: " + p.rating.toFixed(1) + "★" : "",
      o.bewertung ? `${o.bewertung.toFixed(1)}★ ${o.bewertung_quelle || "online"}${o.bewertungen_anzahl ? " (" + o.bewertungen_anzahl + ")" : ""}` : ""]
      .filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    ${o.dauerhaft_geschlossen ? `<div class="diff">Laut Internet dauerhaft geschlossen.</div>` : ""}
    ${o.kurzbeschreibung ? `<p>${esc(o.kurzbeschreibung)}</p>` : ""}
    <section><h3>Infos</h3>
      ${o.oeffnungszeiten ? `<div class="row"><span>🕒 ${esc(o.oeffnungszeiten)}</span></div>` : ""}
      ${o.telefon || menu.phone ? `<div class="row"><span>📞 <a href="tel:${esc(o.telefon || menu.phone)}">${esc(o.telefon || menu.phone)}</a></span></div>` : ""}
      ${o.website ? `<div class="row"><span>🌐 <a href="${esc(o.website)}" target="_blank" rel="noopener">${esc(o.website.replace(/^https?:\/\//, ""))}</a></span></div>` : ""}
      ${o.speisekarte_url ? `<div class="row"><span>📜 <a href="${esc(o.speisekarte_url)}" target="_blank" rel="noopener">Speisekarte online</a></span></div>` : ""}
      <div class="row"><span>🗺️ <a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=18/${p.lat}/${p.lon}" target="_blank" rel="noopener">Auf der Karte öffnen</a> ·
        <a href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=${encodeURIComponent(p.name)}" target="_blank" rel="noopener">Apple Karten</a></span></div>
      <div class="muted" style="font-size:.85rem;margin-top:6px">${esc(checkText)}</div>
    </section>
    ${(o.abweichungen || []).length ? `<section><h3>Abweichungen</h3>${o.abweichungen.map(d => `<div class="diff">${esc(d)}</div>`).join("")}</section>` : ""}
    <section><h3>Besuche</h3>${p.visit_list.length ? p.visit_list.map(v => `
      <div class="visit"><div class="row" style="border:0"><b>${day(v.at)}</b>${stars(v.id, v.rating || 0)}</div>
        ${v.ordered.map(i => `<div class="row"><span>${i.qty > 1 ? i.qty + "× " : ""}${esc(i.name)}${i.note ? ` <span class="muted">– ${esc(i.note)}</span>` : ""}</span><span>${eur(i.price)}</span></div>`).join("")}
        ${v.total != null ? `<div class="row"><b>Summe</b><span><b>${eur(v.total)}</b></span></div>` : ""}
        ${v.note ? `<div class="muted">${esc(v.note)}</div>` : ""}</div>`).join("") : `<div class="muted">Noch kein Besuch eingetragen.</div>`}</section>
    ${p.photos.length ? `<section><h3>Fotos</h3><div class="photos">${p.photos.map(f => `<img loading="lazy" src="api/foto/${f.id}" alt="${esc(f.kind)}">`).join("")}</div></section>` : ""}
    ${p.dishes.length ? `<section><h3>Speisekarte (vom Foto)</h3>${Object.entries(sections).map(([s, list]) => `
      <div class="muted" style="margin-top:8px">${esc(s)}</div>${list.map(d => `<div class="row"><span>${esc(d.name)}${d.description ? `<br><span class="muted" style="font-size:.85rem">${esc(d.description)}</span>` : ""}</span><span>${eur(d.price)}</span></div>`).join("")}`).join("")}</section>` : ""}
    <section><h3>Notiz</h3><textarea id="note" rows="2" placeholder="z. B. Terrasse, reservieren!">${esc(p.note)}</textarea></section>
    <div class="btns">
      <button class="btn primary" id="recheck">Neu abgleichen</button>
      <button class="btn" id="rename">Umbenennen</button>
      <button class="btn danger" id="del">Löschen</button>
    </div>`;
  $("sheet").classList.remove("hidden");
  $("close").onclick = () => { $("sheet").classList.add("hidden"); current = null; };
  $("recheck").onclick = async () => { await api(`api/ort/${p.id}/abgleich`, { method: "POST" }); toast("Abgleich läuft – das dauert etwa eine Minute"); open(p.id); };
  $("rename").onclick = async () => { const name = prompt("Name", p.name); if (name && name.trim()) { await api("api/ort/" + p.id, { method: "PATCH", body: JSON.stringify({ name }) }); open(p.id); load(); } };
  $("del").onclick = async () => { if (confirm(`„${p.name}“ mit allen Besuchen und Fotos löschen?`)) { await api("api/ort/" + p.id, { method: "DELETE" }); $("sheet").classList.add("hidden"); load(); } };
  $("note").onchange = e => api("api/ort/" + p.id, { method: "PATCH", body: JSON.stringify({ note: e.target.value }) }).then(() => toast("Gespeichert"));
  for (const s of document.querySelectorAll(".stars")) s.onclick = async e => {
    const n = e.target.dataset.n; if (!n) return;
    await api("api/ort/" + p.id, { method: "PATCH", body: JSON.stringify({ besuch_id: +s.dataset.visit, bewertung: +n }) });
    open(p.id); load();
  };
  for (const img of document.querySelectorAll(".photos img")) img.onclick = () => {
    const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${img.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z);
  };
}

let timer;
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 250); };
load().catch(e => toast(e.message));
setInterval(() => { if (!document.hidden) load().then(() => current && current.check === "läuft" && open(current.id)).catch(() => {}); }, 20000);
</script>
</body>
</html>
