<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Wer würde eher …?</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <script src="../static/art.js"></script>
  <script src="../static/party.js"></script>
  <style>
    .lead { font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%; }
    .person { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 20px; border: 2px solid var(--glass-border);
      background: var(--glass-strong); font-weight: 700; transition: transform .15s, border-color .2s, box-shadow .2s; animation: rise .35s ease both; }
    .person:hover { transform: translateY(-2px); }
    .person .avatar { width: 50px; height: 50px; font-size: 1.2rem; }
    .person.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); transform: scale(1.03); }
    .crown { font-size: 3.2rem; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
    .bars { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .bar { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; }
    .bar .track { height: 34px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--glass-border); overflow: hidden; position: relative; }
    .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 12px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: grow .9s cubic-bezier(.2,.9,.3,1) both; }
    .bar.win .fill { background: linear-gradient(90deg, #f59e0b, #f97316); }
    .bar .label { position: relative; z-index: 1; padding: 0 12px; line-height: 34px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .cnt { font-weight: 850; min-width: 22px; text-align: right; }
    .bar .voters { grid-column: 2 / 4; display: flex; gap: 4px; flex-wrap: wrap; margin-top: -4px; }
    .bar .voters .avatar { width: 22px; height: 22px; font-size: .6rem; }
    @keyframes grow { from { width: 0 !important; } }
    .titles { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 12px; text-align: left; }
    .titles div { padding: 8px 12px; border-radius: 12px; background: var(--glass-strong); font-size: .88rem; }
    .titles b { color: var(--accent); }
    /* one phone screen */
    .pstage h2 { font-size: clamp(1.15rem, min(4.6vw, 3.4vh), 1.75rem); }
    .pstage .people { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .pstage .person { padding: clamp(6px, 1.4vh, 14px) 6px; gap: 5px; border-radius: 16px; min-height: 44px; font-size: .92rem; }
    .pstage .person span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pstage .person .avatar { width: clamp(32px, 6vh, 50px); height: clamp(32px, 6vh, 50px); font-size: clamp(.85rem, 1.8vh, 1.2rem); }
    .winner { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .winner .crown { font-size: clamp(1.8rem, 5vh, 3.2rem); }
    .pstage .winner .pbig { font-size: clamp(1.7rem, min(8vw, 6vh), 3.2rem); }
    .pstage .bars { gap: 5px; }
    .pstage .bar { grid-template-columns: 26px minmax(0, 1fr) auto; gap: 7px; }
    .pstage .bar > .avatar { width: 26px; height: 26px; font-size: .68rem; }
    .pstage .bar .track { height: 28px; border-radius: 10px; display: flex; align-items: center; }
    .pstage .bar .fill { border-radius: 10px; }
    .pstage .bar .label { line-height: 28px; padding: 0 8px; flex: 1; min-width: 0; font-size: .9rem; }
    .pstage .bar .voters { grid-column: auto; margin: 0 4px 0 0; position: relative; z-index: 1; flex-wrap: nowrap; gap: 0; flex: none; }
    .pstage .bar .voters .avatar { width: 18px; height: 18px; font-size: .5rem; margin-left: -5px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
    /* many rows: two columns */
    .pstage .bars:has(> .bar:nth-child(5)) { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
    .pstage .bars:has(> .bar:nth-child(5)) .bar { grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
    .pstage .bars:has(> .bar:nth-child(5)) .bar > .avatar { display: none; }
    .pstage .bars:has(> .bar:nth-child(5)) .bar .label { font-size: .8rem; }
    .overlay .titles { gap: 4px; margin-top: 10px; max-height: 38dvh; overflow-y: auto; }
    .overlay .titles div { padding: 5px 10px; font-size: .8rem; line-height: 1.3; }
    .tvmain .winner .crown { font-size: 5vw; }
    .tvmain { gap: 1.6vh; }
    .tvmain h2 { font-size: clamp(1.6rem, min(3.4vw, 6vh), 4.2rem); }
    .tvmain .winner .pbig { font-size: clamp(2rem, min(4.6vw, 8vh), 5rem); }
    .tvmain .bars { gap: 1vh; }
    .tvmain .bar .track { display: flex; align-items: center; height: min(4.2vw, 6.4vh); }
    .tvmain .bar .label { flex: 1; min-width: 0; line-height: min(4.2vw, 6.4vh); }
    .tvmain .bar .voters { grid-column: auto; margin: 0 .6vw 0 0; position: relative; z-index: 1; flex: none; flex-wrap: nowrap; gap: 0; }
    .tvmain .bar .voters .avatar { width: min(2.8vw, 4.4vh); height: min(2.8vw, 4.4vh); font-size: 1vw; margin-left: -.5vw; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
    .tvmain .bars:has(> .bar:nth-child(5)) { display: grid; grid-template-columns: 1fr 1fr; gap: 1vh 1.4vw; }
    .tvmain .person .avatar { width: 5vw; height: 5vw; font-size: 2vw; }
    .tvmain .bar { grid-template-columns: 4vw minmax(0, 1fr) auto; } .tvmain .bar .avatar { width: 3.4vw; height: 3.4vw; }
    .tvmain .bar .track { height: 4.2vw; } .tvmain .bar .label { line-height: 4.2vw; font-size: 1.8vw; } .tvmain .bar .cnt { font-size: 2vw; }
  </style>
</head>
<body>
  <section id="table" class="hidden pfit">
    <div class="topbar glass">
      <span class="title">Wer würde eher …?</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div id="stage"></div>
  </section>
  <script>
    const esc = s => Shell.esc(s);
    const gamers = g => g.players.filter(p => !p.screen);
    const titles = g => g.titles.length ? `<div class="titles">${g.titles.filter(t => t.names.length).map(t =>
      `<div><b>${esc(t.names.join(" & "))}</b> ${esc(t.question.replace(/^…\s*/, "würde eher "))}</div>`).join("")}</div>` : "";

    Party.start({
      kind: "werwuerde", title: "Wer würde eher …?", art: "werwuerde", minPlayers: 3, icon: "👑",
      inputPhases: ["vote"],
      settings: [
        { key: "rounds", label: "Fragen", options: [[10, "10 Fragen"], [5, "5 Fragen"], [15, "15 Fragen"], [20, "20 Fragen"]] },
        { key: "seconds", label: "Zeit", options: [[30, "30 Sekunden"], [20, "20 Sekunden"], [45, "45 Sekunden"], [0, "Ohne Zeitlimit"]] },
        { key: "anonymous", label: "Stimmen", options: [[1, "Geheime Abstimmung"], [0, "Offen – alle sehen, wer wen gewählt hat"]] },
        { key: "points", label: "Punkte", options: [[1, "Punkt, wenn du mit der Mehrheit stimmst"], [0, "Ohne Punkte – nur Spaß"]] },
      ],
      build(g, ctx) {
        if (g.phase === "vote") return `<span class="lead">Wer würde eher …</span><h2>${esc(g.question.replace(/^…\s*/, ""))}</h2>
          ${ctx.tv ? "<p>Stimmt auf euren Handys ab!</p>" : `<div class="people">${gamers(g).map(p => `
            <button class="person" data-vote="${p.id}">${Shell.avatar(p)}<span>${p.id === Shell.me ? "Ich" : esc(p.name)}</span></button>`).join("")}</div>`}
          <div data-status></div>`;
        const max = Math.max(1, ...Object.values(g.tally));
        const top = Math.max(0, ...Object.values(g.tally));
        const winners = gamers(g).filter(p => top && g.tally[p.id] === top);
        const rows = gamers(g).filter(p => g.tally[p.id]).sort((a, b) => g.tally[b.id] - g.tally[a.id]);
        return `<span class="lead">Wer würde eher …</span><h2>${esc(g.question.replace(/^…\s*/, ""))}</h2>
          ${winners.length ? `<div class="winner"><div class="crown">👑</div><div class="pbig">${esc(winners.map(p => p.id === Shell.me ? "Du!" : p.name).join(" & "))}</div></div>` : "<p>Niemand hat abgestimmt.</p>"}
          <div class="bars pfill">${rows.map((p, i) => { const voters = Object.keys(g.picks).length ? `<div class="voters">${gamers(g).filter(v => g.picks[v.id] === p.id).map(v => Shell.avatar(v)).join("")}</div>` : "";
            // the voters sit inside the bar (saves a row per person)
            return `<div class="bar ${g.tally[p.id] === top ? "win" : ""}">${Shell.avatar(p)}
            <div class="track"><div class="fill" style="width:${g.tally[p.id] / max * 100}%;animation-delay:${i * 120}ms"></div><span class="label">${esc(p.name)}</span>${voters}</div>
            <span class="cnt">${g.tally[p.id]}</span></div>`; }).join("")}</div>
          ${ctx.tv || !g.settings.points ? "" : `<h3 class="plabel" style="align-self:flex-start">Punktestand</h3>${Party.ranking(g, { gained: true, compact: true })}`}`;
      },
      celebrate: g => !!g.tally[Shell.me],
      bind(g) {
        document.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => Shell.send({ t: "vote", id: b.dataset.vote }));
      },
      update(g) {
        document.querySelectorAll("[data-vote]").forEach(b => b.classList.toggle("on", b.dataset.vote === g.my_pick));
      },
      finished: (g, ranked) => g.settings.points
        ? { icon: "👑", title: ranked[0] && ranked[0].score ? `${ranked[0].id === Shell.me ? "Du kennst" : ranked[0].name + " kennt"} die Runde am besten!` : "Spiel beendet",
            sub: Party.ranking(g) + titles(g) }
        : { icon: "👑", title: "Das waren eure Titel", sub: titles(g) },
    });
  </script>
</body>
</html>
