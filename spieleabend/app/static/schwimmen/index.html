<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Schwimmen</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <style>
    /* French playing cards */
    .card.red { --c1: #f43f5e; --c2: #9f1239; } .card.black { --c1: #475569; --c2: #0f172a; }
    .card.rf .front { display: grid; place-content: center; }
    .card.rf .v { font-size: calc(var(--w) * .44); }
    .card.rf .suit { position: relative; z-index: 1; display: block; text-align: center; font-size: calc(var(--w) * .3); line-height: 1; color: var(--c2); margin-top: calc(var(--w) * -.02); }
    .card.rf .tl { font-size: calc(var(--w) * .16); }
    .card .back {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.2) 0 20%, transparent 21%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 5px, transparent 5px 10px),
        linear-gradient(145deg, #0e7490, #1d4ed8 55%, #6d28d9);
    }
    .card .back span { font-size: calc(var(--w) * .22); }

    /* opponents */
    .opp { min-width: 150px; }
    .opp.out { opacity: .45; filter: grayscale(.7); }
    .opp .mini-fan { display: flex; align-items: flex-end; gap: 0; padding-left: 8px; height: 38px; }
    .opp .mini-fan .card { --cw: 24px; margin-left: -8px; }
    .opp .mini-fan .card .back span { display: none; }
    .lives { display: flex; gap: 2px; align-items: center; font-size: .9rem; line-height: 1; }
    .lives .lost { opacity: .22; filter: grayscale(1); }
    .badge { font-size: .64rem; font-weight: 850; color: #fff; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .badge.knock { background: linear-gradient(135deg, #f59e0b, #ef4444); animation: pulse 1.2s ease-in-out infinite; }
    .badge.swim { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
    .badge.dealer { background: var(--glass-strong); color: var(--muted); border: 1px solid var(--glass-border); }
    .badge.gone { background: #475569; }
    .opp .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    /* table */
    .felt { gap: 12px; }
    .midlabel { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .middle { display: flex; gap: clamp(8px, 2.6vw, 20px); justify-content: center; --cw: clamp(64px, 19vw, 96px); }
    .middle .card.target { cursor: pointer; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn.knock { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .btn.knock:not(:disabled) { animation: pulse 1.6s ease-in-out infinite; }
    .hint { font-size: .85rem; color: var(--muted); text-align: center; min-height: 1.2em; }
    .felt.knocked { animation: knockshake .5s ease both; }
    @keyframes knockshake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .tmr { font-family: ui-monospace, monospace; font-weight: 850; padding: 2px 10px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-border); margin-left: 6px; }
    .tmr.low { color: #fff; background: linear-gradient(135deg, #f97316, #ef4444); border-color: transparent; }

    /* my hand */
    .me .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .me .head b { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .worth { font-weight: 850; font-size: 1.05rem; padding: 4px 12px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-border); }
    .worth.hot { color: #fff; border: 0; background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .myhand { display: flex; gap: clamp(8px, 2.6vw, 20px); justify-content: center; padding-top: 10px; --cw: clamp(66px, 20vw, 100px); }
    .myhand .card.pick:hover { transform: translateY(-6px); }
    .me.out { opacity: .6; }

    /* round end */
    .rres { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 4px; text-align: left; }
    .rr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-border); animation: rise .4s ease both; }
    .rr.lose { box-shadow: 0 0 0 2px var(--danger); }
    .rr .n { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rr .n small { display: block; font-weight: 650; font-size: .75rem; color: var(--muted); }
    .rr .cards { display: flex; gap: 3px; --cw: 28px; }
    .rr .cards .card.rf .v { font-size: calc(var(--w) * .42); }
    .rr .cards .card.rf .tl { display: none; }
    .rr .n { color: var(--text); }
    .rr .val { font-weight: 900; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
    .rtitle { font-size: 1.35rem; margin: 4px 0; }
    .roundpanel { max-width: 460px !important; }

    /* one screen on phones: tighter felt, cards sized by the screen height too */
    @media (max-width: 560px) {
      .felt { gap: 6px; }
      .midlabel { font-size: .66rem; }
      .middle { --cw: clamp(56px, min(26vw, 10vh), 110px); }
      /* the three moves side by side; long labels wrap inside their button */
      .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
      .actions:empty { display: none; }
      .actions .btn { padding: 6px 6px; min-height: 44px; font-size: .86rem; line-height: 1.15; }
      .hint { font-size: .78rem; min-height: 0; }
      .hint:empty { display: none; }
      .me .head { margin-bottom: 4px; }
      .myhand { padding-top: 4px; --cw: clamp(56px, min(26vw, 11vh), 110px); }
    }
    @media (max-width: 560px) and (max-height: 700px) { .midlabel { display: none; } }
    /* many players: compact result rows so the list still fits */
    @media (max-height: 760px) {
      .rres { gap: 5px; margin-top: 8px; }
      .rr { padding: 5px 10px; }
      .rr .cards { --cw: 24px; }
    }

    /* TV: the table only, big */
    body.tv .me, body.tv .topbar { display: none; }
    body.tv #table { padding: 18px; gap: 18px; }
    body.tv .tvwrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(260px, 26vw, 440px); gap: 1.6vw; flex: 1; }
    body.tv .opponents { flex-direction: column; overflow: visible; }
    body.tv .opp { min-width: 0; font-size: clamp(.9rem, 1.3vw, 1.5rem); }
    body.tv .opp .head { font-size: 1em; }
    body.tv .opp .head .avatar { width: 2em; height: 2em; font-size: .8em; }
    body.tv .middle { --cw: clamp(90px, 11vw, 200px); }
    body.tv .status { font-size: clamp(1.1rem, 2vw, 2.2rem); }
    body.tv .log { font-size: clamp(.9rem, 1.3vw, 1.4rem); max-width: none; }
    body.tv .midlabel { font-size: clamp(.9rem, 1.2vw, 1.4rem); }
    body:not(.tv) .topbar { order: -2; } body:not(.tv) .opponents { order: -1; }
    /* never wider than the screen: with several players the strip scrolls from the left instead of
       being centred and cut off on both sides */
    body:not(.tv) .opponents { align-self: stretch; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
    body.tv .roundpanel { max-width: 680px !important; font-size: 1.3rem; }
    body.tv .rtitle { font-size: 2.2rem; }
    .tvcode2 { display: none; }
    body.tv .tvcode2 { display: block; text-align: center; color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.6rem); border-radius: 18px; padding: 12px; }
    body.tv .tvcode2 b { color: var(--text); letter-spacing: .15em; font-family: ui-monospace, monospace; }
    .tvwrap { display: contents; }
    body.tv .tvwrap .side { display: flex; flex-direction: column; gap: 1vw; }
    .tvwrap .side { display: contents; }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Schwimmen</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div class="tvwrap">
      <div class="felt glass" id="felt">
        <span class="midlabel">Mitte</span>
        <div class="middle" id="middle"></div>
        <div class="status" id="status"></div>
        <div class="actions" id="actions"></div>
        <div class="hint" id="hint"></div>
        <div class="log" id="log"></div>
      </div>
      <div class="side">
        <div class="opponents" id="opponents"></div>
        <div class="glass tvcode2" id="tvCode"></div>
      </div>
    </div>
    <div class="me glass" id="me"></div>
  </section>

  <div class="overlay hidden" id="roundEnd">
    <div class="panel glass roundpanel">
      <h3 class="rtitle" id="roundTitle"></h3>
      <div class="rres" id="roundList"></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="nextRound">Weiter</button>
      </div>
      <p class="empty" id="roundWait"></p>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => Shell.esc(s);
    const send = msg => Shell.send(msg);
    const RED = new Set(["♥", "♦"]);
    const num = v => String(v).replace(".", ",");
    let sel = null, before = {}, lastSeq = null, endAt = null;

    function cardHtml(c, cls = "", attrs = "") {
      if (!c) return Shell.card(`facedown ${cls}`, "", attrs, "", "31");
      return Shell.card(`rf ${RED.has(c.s) ? "red" : "black"} ${cls}`, `<span class="tl">${esc(c.r)}</span><span class="v">${esc(c.r)}</span><span class="suit">${c.s}</span>`, attrs);
    }
    const lives = (p, max) => p.out ? '<span class="badge gone">💧 raus</span>' : p.swimming ? '<span class="badge swim">🏊 schwimmt</span>'
      : `<span class="lives" title="${p.lives} Leben">${Array.from({ length: max }, (_, i) => `<span class="${i < p.lives ? "" : "lost"}">❤️</span>`).join("")}</span>`;

    window.GAME = {
      kind: "schwimmen", title: "Schwimmen",
      fan: [{ r: "A", s: "♥" }, { r: "K", s: "♥" }, { r: "D", s: "♥" }, { r: "7", s: "♠" }].map(c => cardHtml(c)).join(""),
      settings: [
        { key: "lives", label: "Leben", options: [[3, "3 Leben + Schwimmen"], [2, "2 Leben + Schwimmen"], [4, "4 Leben + Schwimmen"]] },
        { key: "seconds", label: "Zugzeit", options: [[60, "60 Sekunden pro Zug"], [30, "30 Sekunden pro Zug"], [90, "90 Sekunden pro Zug"], [0, "Ohne Zeitlimit"]] },
      ],
      minPlayers: 2,
      countPlayers: g => g.players.filter(p => !p.screen).length,
      roomPlayer: (p, me, g) => {
        if (p.id !== me) return p.screen ? '<span class="tag tv">📺 Fernseher</span>' : "";
        if (p.screen) return '<button class="btn tvbtn" data-room-act="screen" title="Dieses Gerät zeigt nur den Tisch">📺 Fernseher ✓</button>';
        return g.players.some(q => q.screen) ? "" : '<button class="btn ghost tvbtn" data-room-act="screen" title="Dieses Gerät wird zum Fernseher: zeigt den Tisch und spielt nicht mit">📺 Fernseher</button>';
      },
      render: fromServer => { if (fromServer) remember(); draw(); if (fromServer) animate(); },
      finished: () => {
        const g = Shell.game, mine = g.players.find(p => p.id === Shell.me);
        const ranked = g.players.filter(p => !p.screen).sort((a, b) => (a.out - b.out) || (b.out_round - a.out_round) || (b.lives - a.lives));
        return {
          icon: "🏊",
          title: g.winner ? (mine && g.winner === mine.name ? "Du hast gewonnen!" : `${g.winner} gewinnt!`) : "Spiel beendet",
          sub: `<div class="rres">${ranked.map(p => `<div class="rr">${Shell.avatar(p)}<span class="n">${esc(p.name)}</span>${p.name === g.winner ? "🏆" : lives(p, g.settings.lives)}</div>`).join("")}</div>`
            + (g.host === Shell.me ? "" : '<p class="empty">Der Gastgeber kann ein neues Spiel starten.</p>'),
        };
      },
    };

    function remember() {
      before = {};
      document.querySelectorAll("[data-key]").forEach(el => { before[el.dataset.key] = Shell.rect(el); });
    }

    function draw() {
      const g = Shell.game, me = g.players.find(p => p.id === Shell.me) || {};
      const tv = !!me.screen, myTurn = g.state === "playing" && g.phase === "turn" && g.turn === Shell.me;
      document.body.classList.toggle("tv", tv);
      $("tableCode").textContent = `Code ${g.code} · Runde ${g.round}`;
      $("tvCode").innerHTML = `Mitspielen: <b>${esc(g.code)}</b>`;
      if (!myTurn) sel = null;
      endAt = g.remaining == null ? null : Date.now() + g.remaining * 1000;

      // players around the table (TV: everyone; phone: the others, in playing order after me)
      const idx = Math.max(0, g.players.findIndex(p => p.id === Shell.me));
      const order = g.players.map((_, i) => g.players[(idx + i) % g.players.length]).filter(p => !p.screen && (tv || p.id !== Shell.me));
      $("opponents").innerHTML = order.map(p => `
        <div class="opp glass ${g.turn === p.id && g.phase === "turn" && g.state === "playing" ? "turn" : ""} ${p.out ? "out" : ""}" data-key="o${p.id}" id="o${p.id}">
          <div class="head">${Shell.avatar(p)}<span class="n">${esc(p.name)}</span>
            ${g.turn === p.id && g.phase === "turn" && g.state === "playing" ? '<span class="thinking"><i></i><i></i><i></i></span>' : ""}
            ${g.knocker === p.id ? '<span class="badge knock">✊ geklopft</span>' : ""}</div>
          <div class="meta">${p.out ? "" : `<div class="mini-fan">${[0, 1, 2].map(() => cardHtml(null)).join("")}</div>`}
            ${lives(p, g.settings.lives)}${p.dealer ? '<span class="badge dealer">🎴 Geber</span>' : ""}</div>
        </div>`).join("");

      // the middle
      const canSwap = myTurn && sel && sel.from === "hand";
      $("middle").innerHTML = g.middle.map((c, i) => cardHtml(c,
        `${myTurn ? "pick" : ""} ${canSwap ? "target" : ""} ${sel && sel.from === "middle" && sel.i === i ? "selected" : ""}`,
        `data-key="m${i}" data-mid="${i}"`)).join("");

      // status line and buttons
      const cur = g.players.find(p => p.id === g.turn);
      let status = "";
      if (g.state !== "playing") status = "Spiel vorbei";
      else if (g.phase === "round_end") status = "Runde vorbei";
      else if (myTurn) status = g.knocker ? "Letzter Zug – es wurde geklopft!" : "Du bist dran";
      else if (cur) status = `${cur.name} ist dran` + (g.knocker ? " · letzter Zug" : "");
      $("status").innerHTML = esc(status) + (endAt != null && g.phase === "turn" ? ' <span class="tmr" id="tmr"></span>' : "");
      $("status").classList.toggle("mine", myTurn);
      $("actions").innerHTML = myTurn ? `
        <button class="btn ghost" data-act="swap_all">🔄 Alle drei tauschen</button>
        <button class="btn ghost" data-act="pass">👉 Schieben</button>
        <button class="btn knock" data-act="knock" ${g.knocker ? "disabled" : ""}>✊ Klopfen</button>` : "";
      $("hint").textContent = myTurn
        ? (sel ? (sel.from === "hand" ? "Jetzt eine Karte aus der Mitte antippen" : "Jetzt eine deiner Karten antippen") : "Tippe eine deiner Karten und eine aus der Mitte zum Tauschen")
        : g.state === "playing" && g.phase === "turn" && g.passes && !g.knocker
          ? `${g.passes} von ${g.active} haben geschoben${g.replaced ? " – die Mitte wurde schon getauscht" : ""}` : "";
      $("log").textContent = g.log.slice(-2).join(" · ");
      tick();

      // my hand
      if (!tv) {
        const val = g.value;
        $("me").classList.toggle("turn", myTurn);
        $("me").classList.toggle("out", !!me.out);
        $("me").innerHTML = me.out
          ? `<div class="head"><b>Du bist untergegangen</b>${lives(me, g.settings.lives)}</div><p class="empty" style="text-align:center;margin:0">Schau zu, wer als Letzter übrig bleibt.</p>`
          : `<div class="head"><b>Deine Karten</b>${lives(me, g.settings.lives)}
              ${val != null ? `<span class="worth ${val >= 30 ? "hot" : ""}">${val === 33 ? "🔥 Feuer · 33" : val === 30.5 ? "Drilling · 30,5" : "Wert " + num(val)}</span>` : ""}</div>
            <div class="myhand">${g.hand.map((c, i) => cardHtml(c,
              `${myTurn ? "pick" : ""} ${sel && sel.from === "middle" ? "target" : ""} ${sel && sel.from === "hand" && sel.i === i ? "selected" : ""}`,
              `data-key="h${i}" data-hand="${i}"`)).join("")}</div>`;
      }

      // round end
      const showRound = g.state === "playing" && g.phase === "round_end" && g.result && g.result.values;
      $("roundEnd").classList.toggle("hidden", !showRound);
      if (showRound) roundEnd(g);
    }

    function roundEnd(g) {
      const r = g.result, by = g.players.find(p => p.id === r.by), name = p => p.id === Shell.me ? "Du" : p.name;
      $("roundTitle").textContent = r.reason === "feuer" ? `🔥 Feuer! ${by ? name(by) + (by.id === Shell.me ? " hast" : " hat") : ""} drei Asse`
        : r.reason === "knock" ? `✊ ${by ? (by.id === Shell.me ? "Du hast" : by.name + " hat") : "Es wurde"} geklopft`
        : "Alle haben zweimal geschoben";
      const rows = g.players.filter(p => r.values[p.id] != null).sort((a, b) => r.values[b.id] - r.values[a.id]);
      $("roundList").innerHTML = rows.map((p, i) => {
        const lost = r.losers.includes(p.id);
        const what = r.out.includes(p.id) ? "💧 geht unter – raus" : r.swim.includes(p.id) ? "🏊 schwimmt jetzt" : lost ? "−1 Leben" : "";
        const hand = r.hands && r.hands[p.id] ? `<div class="cards">${r.hands[p.id].map(c => cardHtml(c)).join("")}</div>` : "";
        return `<div class="rr ${lost ? "lose" : ""}" style="animation-delay:${i * 70}ms">${Shell.avatar(p)}
          <span class="n">${esc(name(p))}<small>${what || (p.swimming ? "🏊 schwimmt" : `❤️ ${p.lives}`)}</small></span>
          ${hand}<span class="val">${r.values[p.id] === 33 ? "🔥 33" : num(r.values[p.id])}</span></div>`;
      }).join("") + (r.spared ? '<p class="empty">Gleichstand – alle schwimmen, die Runde zählt nicht.</p>' : "");
      $("roundWait").textContent = "";
    }

    function tick() {
      const left = endAt == null ? null : Math.max(0, Math.ceil((endAt - Date.now()) / 1000)), g = Shell.game;
      const t = $("tmr");
      if (t && left != null) { t.textContent = `⏱ ${left}`; t.classList.toggle("low", left <= 10); }
      const w = $("roundWait");
      if (w && g && g.phase === "round_end" && left != null) w.textContent = `Nächste Runde startet in ${left} s`;
    }
    setInterval(tick, 300);

    function animate() {
      const g = Shell.game, ev = g.last || {}, prev = Shell.prev;
      if (ev.seq === lastSeq) return;
      const first = lastSeq === null;
      lastSeq = ev.seq;
      if (first && ev.kind !== "deal") return;
      if (ev.kind === "deal" || !prev) {
        document.querySelectorAll(".myhand .card, .middle .card").forEach((c, i) => { c.classList.add("deal"); c.style.animationDelay = i * 60 + "ms"; });
        return;
      }
      const mid = [...document.querySelectorAll(".middle .card")];
      if (ev.kind === "swap" || ev.kind === "swap_all") {
        const mine = ev.by === Shell.me;
        const idx = ev.kind === "swap" ? [ev.middle] : [0, 1, 2];
        idx.forEach(i => {
          const from = mine ? before["h" + (ev.kind === "swap" ? ev.hand : i)] : before["o" + ev.by];
          if (mid[i]) { if (!mine) mid[i].classList.add("flip"); Shell.fly(mid[i], from); }
        });
        if (mine) (ev.kind === "swap" ? [ev.hand] : [0, 1, 2]).forEach(i => {
          const node = document.querySelector(`.myhand [data-hand="${i}"]`);
          if (node) Shell.fly(node, before["m" + (ev.kind === "swap" ? ev.middle : i)]);
        });
      } else if (ev.kind === "replace") {
        mid.forEach((c, i) => { c.classList.add("flip"); c.style.animationDelay = i * 90 + "ms"; });
        Shell.toast("Alle haben geschoben – neue Mitte!");
      } else if (ev.kind === "knock") {
        const felt = $("felt"); felt.classList.remove("knocked"); void felt.offsetWidth; felt.classList.add("knocked");
        const box = $("o" + ev.by) || (ev.by === Shell.me ? $("me") : null);
        Shell.burst(box, "Klopf, klopf!");
        if (navigator.vibrate && ev.by !== Shell.me) navigator.vibrate([60, 60, 60]);
      } else if (ev.kind === "pass") {
        const box = $("o" + ev.by);
        if (box) Shell.burst(box, "schiebt");
      } else if (ev.kind === "end" && g.result && g.result.reason === "feuer") {
        Shell.confetti();
      }
    }

    // ---------- input ----------
    function choose(from, i) {
      const g = Shell.game;
      if (!(g.state === "playing" && g.phase === "turn" && g.turn === Shell.me)) return;
      if (sel && sel.from !== from) {
        const hand = from === "hand" ? i : sel.i, middle = from === "middle" ? i : sel.i;
        sel = null;
        send({ t: "swap", hand, middle });
        return;
      }
      sel = sel && sel.i === i ? null : { from, i };
      draw();
    }
    $("middle").addEventListener("click", e => { const c = e.target.closest("[data-mid]"); if (c) choose("middle", +c.dataset.mid); });
    $("me").addEventListener("click", e => { const c = e.target.closest("[data-hand]"); if (c) choose("hand", +c.dataset.hand); });
    $("actions").addEventListener("click", e => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "knock" && !confirm("Klopfen? Danach hat jeder noch genau einen Zug.")) return;
      send({ t: b.dataset.act });
    });
    $("nextRound").onclick = () => send({ t: "next_round" });
    $("leaveGame").onclick = () => Shell.leaveGame();
  </script>
  <script>Shell.start(window.GAME);</script>
</body>
</html>
