<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Lügenbaron</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <script src="../static/art.js"></script>
  <script src="../static/party.js"></script>
  <style>
    .fact { font-size: clamp(1.25rem, 4.8vw, 1.8rem); font-weight: 800; line-height: 1.35; letter-spacing: -.01em; }
    .fact .fill { color: var(--ok); }
    .tvmain .fact { font-size: clamp(2rem, 4vw, 4.6rem); }
    .stamp { display: inline-block; font-size: .72rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; margin-top: 8px; }
    .stamp.ok { background: var(--ok); color: #fff; } .stamp.lie { background: var(--danger); color: #fff; }
    .pchoice.mine { border-style: dashed; }
    /* one phone screen: compact answers in two columns */
    .pstage .fact { font-size: clamp(1.08rem, min(4.8vw, 3.3vh), 1.8rem); line-height: 1.3; }
    .pstage .pchoices { grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 6px; }
    .pstage .pchoice { padding: 8px 10px; min-height: 44px; border-radius: 14px; font-size: .92rem; line-height: 1.25; }
    .pstage .pchoice small { margin-top: 2px; }
    .pstage .fact.small { font-size: clamp(1rem, min(4.4vw, 2.9vh), 1.6rem); }
    .pstage .rev .pchoice { padding: 5px 8px; font-size: .82rem; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .pstage .rev .stamp.lie { display: none; }
    .pstage .rev .meta { flex-wrap: nowrap; max-width: 100%; }
    .pstage .rev .meta .au { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pstage .rev .meta .au::before { content: "🤥 "; }
    .pstage .rev .pchoice .who { flex: none; flex-wrap: nowrap; gap: 0; }
    .pstage .rev .pchoice .who .avatar { width: 17px; height: 17px; font-size: .52rem; margin-left: -4px; box-shadow: 0 0 0 1.5px var(--glass-border); }
    .rev .meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px; font-size: .72rem; color: var(--muted); font-weight: 650; }
    .rev .stamp { margin: 0; font-size: .62rem; padding: 2px 7px; }
    .pstage .rev .pchoice .who { margin: 0 0 0 4px; }
    .pstage .rule { font-size: .74rem; }
    .pstage .rev { gap: 5px; }
    .pstage .rev:has(> :nth-child(8)) .pchoice { padding-top: 3px; padding-bottom: 3px; }
    /* many answers on a small phone: the (always same) scoring hint makes room */
    @media (max-height: 700px) { .pstage:has(.rev > :nth-child(8)) .rule { display: none; } }
    .tvmain { gap: 1.2vw; }
    .tvmain .fact { font-size: clamp(1.8rem, min(3.6vw, 6vh), 4.6rem); margin-top: 2.4vw; }
    .tvmain .pchoices { grid-template-columns: repeat(auto-fill, minmax(min(100%, 17vw), 1fr)); gap: .8vw; }
    .tvmain .pchoice { font-size: clamp(1rem, min(1.6vw, 2.8vh), 2rem); padding: .8vw 1vw; }
    .tvmain .rev .pchoice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3vw; }
    .tvmain .rev .who .avatar { width: 2vw; height: 2vw; font-size: .8vw; }
    .tvmain .rule { font-size: clamp(.8rem, 1.2vw, 1.4rem); }
    .tvmain .pchoices:has(> :nth-child(7)) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tvmain .pchoices:has(> :nth-child(7)) .pchoice { font-size: clamp(.9rem, min(1.3vw, 2.4vh), 1.7rem); }
    .tvmain .fact.small { font-size: clamp(1.6rem, min(3.2vw, 5.4vh), 4.2rem); }
    .tvmain .rev .meta { font-size: clamp(.8rem, 1.2vw, 1.4rem); }
    .tvmain .rev .stamp { font-size: clamp(.7rem, 1vw, 1.2rem); }
  </style>
</head>
<body>
  <section id="table" class="hidden pfit">
    <div class="topbar glass">
      <span class="title">Lügenbaron</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div id="stage"></div>
  </section>
  <script>
    const esc = s => Shell.esc(s);
    let editing = false;

    function mine(g, ctx) {
      if (ctx.tv) return "";
      if (g.my_answer && !editing) return `<p class="pdone">✓ Deine Lüge: „${esc(g.my_answer)}“</p><button class="btn ghost small" id="edit">Ändern</button>`;
      return Party.form("lieForm", "Deine erfundene Antwort", "Lügen 🤥", 40);
    }
    const bindForm = () => Party.onForm("lieForm", v => { editing = false; Shell.send({ t: "write", text: v }); });

    Party.start({
      kind: "luegenbaron", title: "Lügenbaron", art: "luegenbaron", minPlayers: 3, icon: "🤥",
      inputPhases: ["write", "pick"],
      settings: [
        { key: "rounds", label: "Runden", options: [[6, "6 Runden"], [4, "4 Runden"], [8, "8 Runden"], [10, "10 Runden"]] },
        { key: "seconds", label: "Zeit", options: [[75, "75 Sekunden"], [60, "60 Sekunden"], [120, "2 Minuten"], [0, "Ohne Zeitlimit"]] },
      ],
      build(g, ctx) {
        editing = false;
        if (g.phase === "write") return `<div class="fact">${Party.gap(g.sentence)}</div>
          <p>${ctx.tv ? "Jeder denkt sich eine glaubwürdige falsche Antwort aus …" : "Erfinde eine Antwort, die so echt klingt, dass die anderen darauf reinfallen."}</p>
          <div id="mine" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px"></div><div data-status></div>`;
        if (g.phase === "pick") return `<div class="fact">${Party.gap(g.sentence)}</div>
          <p>${ctx.tv ? "Welche Antwort ist die Wahrheit?" : "Welche Antwort ist die Wahrheit? Tippe sie an."}</p>
          <div class="pchoices pfill">${g.options.map((o, i) => ctx.tv
            ? `<div class="pchoice" style="animation-delay:${i * 70}ms">${esc(o.text)}</div>`
            : `<button class="pchoice ${o.mine ? "mine" : ""}" data-pick="${o.id}" ${o.mine ? "disabled" : ""} style="animation-delay:${i * 70}ms">${esc(o.text)}${o.mine ? "<small>deine Lüge</small>" : ""}</button>`).join("")}</div>
          <div data-status></div>`;
        const opts = [...g.options].sort((a, b) => (a.truth - b.truth) || (a.pickers.length - b.pickers.length));
        return `<div class="fact small">${Party.gap(g.sentence, g.truth)}</div>
          <div class="pchoices rev pfill">${opts.map((o, i) => `<div class="pchoice ${o.truth ? "truth" : ""}" style="animation-delay:${i * 120}ms">
            <span>${esc(o.text)}</span><span class="meta"><span class="stamp ${o.truth ? "ok" : "lie"}">${o.truth ? "✓ Wahrheit" : "Lüge"}</span>
            ${o.truth ? "" : `<span class="au">von ${esc(o.authors.map(a => Party.nameOf(g, a)).join(" & "))}</span>`}
            ${o.pickers.length ? `<span class="who">${o.pickers.map(id => Shell.avatar(g.players.find(p => p.id === id) || { name: "?" })).join("")}</span>` : ""}</span></div>`).join("")}</div>
          ${ctx.tv ? "" : `<h3 class="plabel" style="align-self:flex-start">Punktestand</h3>${Party.ranking(g, { gained: true, compact: true })}`}
          <p class="pmuted rule">Wahrheit gefunden +2 · pro Reinfall auf deine Lüge +1</p>`;
      },
      celebrate: g => (g.players.find(p => p.id === Shell.me) || {}).gained >= 2,
      bind(g) {
        document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => Shell.send({ t: "pick", id: b.dataset.pick }));
      },
      update(g, ctx) {
        if (g.phase === "write" && Party.set("mine", mine(g, ctx))) {
          bindForm();
          const e = document.getElementById("edit");
          if (e) e.onclick = () => { editing = true; Party.set("mine", mine(g, ctx)); bindForm(); };
        }
        document.querySelectorAll("[data-pick]").forEach(b => b.classList.toggle("on", b.dataset.pick === g.my_pick));
      },
    });
  </script>
</body>
</html>
