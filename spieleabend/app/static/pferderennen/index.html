<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Pferderennen</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <script src="../static/party.js"></script>
  <style>
    .card.red { --c1: #f43f5e; --c2: #9f1239; } .card.black { --c1: #475569; --c2: #0f172a; }
    .card.rf .front { display: grid; place-content: center; }
    .card.rf .v { font-size: calc(var(--w) * .46); }
    .card.rf .suit { position: relative; z-index: 1; display: block; text-align: center; font-size: calc(var(--w) * .26); color: var(--c2); margin-top: calc(var(--w) * -.04); }
    .horses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
    .horses button { padding: 14px 4px; border-radius: 18px; border: 2px solid var(--glass-border); background: var(--glass-strong); font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .15s, border-color .2s, box-shadow .2s; }
    .horses button b { font-size: 2.2rem; line-height: 1; }
    .horses button.r b { color: #e11d48; }
    .horses button.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); transform: scale(1.04); }
    .sips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .sips button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass-strong); font-weight: 850; font-size: 1.05rem; }
    .sips button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
    .race { width: 100%; display: flex; flex-direction: column; gap: 6px; --cw: min(38px, 9vw); }
    .tvmain .race { --cw: 4.2vw; gap: .8vw; }
    .lane { position: relative; height: calc(var(--cw) * 1.42 + 8px); border-radius: 14px; background:
        repeating-linear-gradient(90deg, transparent 0 calc(100% / 9 - 2px), var(--glass-border) calc(100% / 9 - 2px) calc(100% / 9));
      background-color: var(--glass); border: 1px solid var(--glass-border); }
    .lane::after { content: "🏁"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: calc(var(--cw) * .5); }
    .lane .card { position: absolute; top: 4px; left: calc((100% - var(--cw) - 8px) * var(--p) / 8 + 4px); transition: left .7s cubic-bezier(.3,.9,.3,1.2); }
    .lane.lead .card .front { box-shadow: 0 0 0 3px #f59e0b; }
    .lane .bettors { position: absolute; left: 6px; bottom: -2px; display: flex; gap: 2px; z-index: 2; }
    .lane .bettors .avatar { width: 18px; height: 18px; font-size: .5rem; }
    .side { display: flex; gap: 4px; justify-content: center; --cw: min(30px, 7vw); align-items: center; }
    .tvmain .side { --cw: 3vw; }
    #side { display: flex; gap: 4px; }
    .side small { font-size: .7rem; color: var(--muted); font-weight: 700; margin-right: 6px; }
    .drawrow { display: flex; align-items: center; gap: 12px; justify-content: center; min-height: 64px; --cw: 44px; }
    .tvmain .drawrow { --cw: 5vw; }
    .event { font-weight: 800; }
    .tvmain .event { font-size: 2vw; }
    .mybet { font-weight: 750; }
    .verdict { font-size: clamp(1.5rem, 6.5vw, 2.2rem); font-weight: 900; animation: popin .6s cubic-bezier(.2,.9,.3,1.3) both; }
    .verdict.drink { color: #f59e0b; } .verdict.give { color: var(--accent); }
    .payout { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .payout .r { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--glass-border); text-align: left; }
    .payout .n { flex: 1; font-weight: 650; }
    /* ---- one screen, no scrolling (page-local; same block in every drinking game) ---- */
    body:not(.tv) #table#table:not(.hidden) { height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 0; }
    body:not(.tv) #stage#stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    body:not(.tv) #stage#stage > .pstage { flex: 1 1 0; min-height: 0; gap: clamp(6px, 1.6vh, 16px); padding: clamp(10px, 1.8vh, 18px) 14px; }
    body:not(.tv) .pstage > .phead + * { margin-top: auto; }
    body:not(.tv) .pstage > :last-child { margin-bottom: auto; }
    body:not(.tv) .pstage .plabel { margin: 0 0 -2px; }
    .topbar .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pctl { flex-wrap: nowrap; width: 100%; max-width: 420px; }
    .pctl .btn { flex: 1 1 auto; min-height: 44px; padding: 10px; font-size: .95rem; white-space: nowrap; }
    .pctl .btn.small { flex: 0 1 auto; min-height: 40px; }
    /* scores: compact rows, two columns from 5 players on; shrinks (and scrolls) only as a last resort */
    .pstage .pscore, #finished .pscore { gap: 5px; }
    body:not(.tv) .pstage .pscore { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
    .pstage .pscore:has(.ps:nth-child(5)), #finished .pscore:has(.ps:nth-child(6)) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pstage .pscore .ps, #finished .pscore .ps { padding: 4px 9px; gap: 7px; border-radius: 12px; }
    .pstage .pscore .avatar, #finished .pscore .avatar { width: 26px; height: 26px; font-size: .75rem; }
    .pstage .pscore .pos, #finished .pscore .pos { width: auto; min-width: 12px; font-size: .78rem; }
    .pstage .pscore .pts, #finished .pscore .pts { min-width: 16px; }
    .pstage .pscore:has(.ps:nth-child(5)) .ps { gap: 5px; padding: 4px 7px; font-size: .9rem; }
    .pstage .pscore .plus { font-size: .78rem; }
    body:not(.tv) .pstage .pscore:has(.ps:nth-child(7)) .ps { padding-top: 2px; padding-bottom: 2px; }
    body:not(.tv) .pstage .pscore:has(.ps:nth-child(7)) .avatar { width: 22px; height: 22px; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) { gap: 4px 8px; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) .d { font-size: .8rem; }
    #finished .panel { max-height: calc(100dvh - 32px); overflow-y: auto; }
    #finished .trophy { font-size: 2.8rem; }
    body:not(.tv) .drinkers { gap: 6px 10px; }
    body:not(.tv) .drinkers .d { gap: 3px; font-size: .9rem; }
    body:not(.tv) .drinkers .avatar { width: clamp(34px, 6.4vh, 54px); height: clamp(34px, 6.4vh, 54px); font-size: 1.05rem; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) .avatar { width: 28px; height: 28px; font-size: .8rem; }
    body:not(.tv) .pbanner { font-size: clamp(1.25rem, 3.4vh, 2.1rem); }
    /* game: track sized by the screen height; before the start and after the finish the draw row (and side cards) step aside */
    body:not(.tv) .race { --cw: clamp(24px, 4.5vh, 38px); gap: clamp(4px, .8vh, 6px); }
    .tvmain .race { --cw: min(4.2vw, 6.2vh); gap: min(.8vw, 1vh); }
    .tvmain .side { --cw: min(3vw, 4.4vh); }
    .tvmain .drawrow { --cw: min(5vw, 7vh); }
    .tvmain { gap: min(2vw, 2.4vh); }
    body:not(.tv) .side { --cw: clamp(22px, 4vh, 30px); }
    .side small { font-size: .75rem; }
    body:not(.tv) .lane .bettors .avatar { width: 22px; height: 22px; font-size: .75rem; }
    body:not(.tv) .drawrow { --cw: clamp(30px, 5.2vh, 44px); min-height: 0; }
    .drawrow.ph-bet, .drawrow.ph-reveal, .side.ph-reveal { display: none; }
    body:not(.tv) .horses button { padding: clamp(8px, 1.8vh, 14px) 4px; }
    body:not(.tv) .horses button b { font-size: clamp(1.6rem, 4.4vh, 2.2rem); }
    body:not(.tv) .pstage p { font-size: .9rem; line-height: 1.35; }
    .mybet:empty { display: none; }
    body:not(.tv) .verdict { font-size: clamp(1.2rem, 3.6vh, 2.2rem); }
    .payout { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 5px; }
    .payout .r { padding: 4px 9px; gap: 7px; border-radius: 12px; font-size: .9rem; min-width: 0; }
    .payout .r .avatar { width: 26px; height: 26px; font-size: .75rem; }
    .payout .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .payout b { white-space: nowrap; }
    .tvmain .payout { grid-template-columns: repeat(auto-fill, minmax(min(100%, 21vw), 1fr)); }
    .tvmain .payout .r { font-size: clamp(.9rem, 1.3vw, 1.5rem); padding: .5vw 1vw; }
    .tvmain .payout .r .avatar { width: clamp(26px, 2.4vw, 44px); height: clamp(26px, 2.4vw, 44px); }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Pferderennen</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div id="stage"></div>
  </section>
  <script>
    const esc = s => Shell.esc(s);
    const SUITS = ["♥", "♦", "♣", "♠"], RED = new Set(["♥", "♦"]);
    const card = (c, extra = "") => c ? Shell.card(`rf ${RED.has(c.suit) ? "red" : "black"} ${extra}`, `<span class="v">${esc(c.rank)}</span><span class="suit">${c.suit}</span>`)
      : `<div class="card facedown ${extra}"><div class="inner"><div class="face front"></div><div class="face back"><span>★</span></div></div></div>`;
    let pick = { suit: null, sips: 2 };

    function track(g) {
      return `<div class="race">${SUITS.map(s => `<div class="lane" data-lane="${s}" style="--p:0">${card({ rank: "A", suit: s })}<div class="bettors"></div></div>`).join("")}</div>
        <div class="side ph-${g.phase}"><small>Seitenkarten</small><span id="side"></span></div>
        <div class="drawrow ph-${g.phase}"><span id="drawn"></span><span class="event" id="event">Gleich geht's los …</span></div>`;
    }

    Party.start({
      kind: "pferderennen", title: "Pferderennen", minPlayers: 2, icon: "🏇", drink: true,
      fan: SUITS.map(s => card({ rank: "A", suit: s })).join(""),
      inputPhases: ["bet"], nextLabel: "Nächstes Rennen →", skipLabel: "🏁 Rennen starten",
      head: g => `Rennen ${g.round} / ${g.rounds}`,
      settings: [
        { key: "rounds", label: "Rennen", options: [[3, "3 Rennen"], [1, "1 Rennen"], [5, "5 Rennen"]] },
        { key: "seconds", label: "Wettzeit", options: [[45, "45 Sekunden zum Wetten"], [30, "30 Sekunden"], [0, "Bis alle gewettet haben"]] },
      ],
      build(g, ctx) {
        if (g.phase === "bet") {
          if (!g.my_bet) pick = { suit: null, sips: pick.sips || 2 };
          return `<h2>Auf welches Pferd setzt du?</h2>
            ${ctx.tv ? `<p>Wettet auf euren Handys!</p>${track(g)}` : `<div class="horses">${SUITS.map(s => `<button class="${RED.has(s) ? "r" : ""}" data-suit="${s}"><b>${s}</b>${g.names[s]}</button>`).join("")}</div>
            <p>Wie viele Schlucke setzt du? Verlierst du, trinkst du sie – gewinnst du, verteilst du das Doppelte.</p>
            <div class="sips">${[1, 2, 3, 4, 5].map(n => `<button data-sips="${n}">${n}</button>`).join("")}</div>
            <button class="btn" id="betBtn">Wette abgeben</button><p class="mybet" id="mybet"></p>`}
            <div data-status></div>`;
        }
        if (g.phase === "race") return `${track(g)}${ctx.tv ? "" : `<p class="mybet">${g.my_bet && g.my_bet.suit ? `Dein Pferd: <b>${g.my_bet.suit} ${g.names[g.my_bet.suit]}</b> · ${g.my_bet.sips} Schlucke` : "Du hast nicht gewettet"}</p>`}`;
        const mine = g.my_bet && g.my_bet.suit;
        const bettors = Object.entries(g.bets).filter(([, b]) => b && b.suit).map(([id, b]) => ({ p: g.players.find(x => x.id === id), b })).filter(x => x.p);
        return `${track(g)}<div class="pbanner">🏆 ${g.winner} ${g.names[g.winner]} gewinnt!</div>
          ${ctx.tv || !mine ? "" : mine === g.winner ? `<div class="verdict give">🎁 Du verteilst ${g.my_bet.sips * 2}!</div>` : `<div class="verdict drink">🍺 Du trinkst ${g.my_bet.sips}!</div>`}
          <div class="payout">${bettors.map(({ p, b }) => `<div class="r">${Shell.avatar(p)}<span class="n">${p.id === Shell.me ? "Du" : esc(p.name)} · ${b.suit}</span>
            <b>${b.suit === g.winner ? `🎁 ${ctx.tv ? "verteilt " : ""}${b.sips * 2}` : `🍺 ${ctx.tv ? "trinkt " : ""}${b.sips}`}</b></div>`).join("")}</div>`;
      },
      bind(g) {
        document.querySelectorAll("[data-suit]").forEach(b => b.onclick = () => { pick.suit = b.dataset.suit; this.mark(); });
        document.querySelectorAll("[data-sips]").forEach(b => b.onclick = () => { pick.sips = +b.dataset.sips; this.mark(); });
        const bet = document.getElementById("betBtn");
        if (bet) bet.onclick = () => pick.suit ? Shell.send({ t: "bet", suit: pick.suit, sips: pick.sips }) : Shell.toast("Bitte zuerst ein Pferd wählen");
      },
      mark() {
        document.querySelectorAll("[data-suit]").forEach(b => b.classList.toggle("on", b.dataset.suit === pick.suit));
        document.querySelectorAll("[data-sips]").forEach(b => b.classList.toggle("on", +b.dataset.sips === pick.sips));
      },
      update(g) {
        if (g.phase === "bet") {
          if (g.my_bet && g.my_bet.suit && !pick.suit) pick = { ...g.my_bet };
          this.mark();
          const mb = document.getElementById("mybet");
          if (mb) mb.textContent = g.my_bet && g.my_bet.suit ? `✓ Gewettet: ${g.my_bet.suit} ${g.names[g.my_bet.suit]} · ${g.my_bet.sips} Schlucke (du kannst noch ändern)` : "";
        }
        const lead = Math.max(...Object.values(g.pos));
        document.querySelectorAll("[data-lane]").forEach(l => {
          const s = l.dataset.lane;
          l.style.setProperty("--p", Math.min(8, g.pos[s]));
          l.classList.toggle("lead", lead > 0 && g.pos[s] === lead);
          Party.set(l.querySelector(".bettors"), Object.entries(g.bets).filter(([, b]) => b && b.suit === s).map(([id]) => Shell.avatar(g.players.find(p => p.id === id) || { name: "?" })).join(""));
        });
        Party.set("side", g.side.map(c => card(c)).join(""));
        Party.set("drawn", g.draw ? card(g.draw) : "");
        const ev = document.getElementById("event"); if (ev && g.event) ev.textContent = g.event;
      },
      finished: (g, ranked) => ({ icon: "🏇", title: ranked[0] && ranked[0].score ? `${ranked[0].id === Shell.me ? "Du hast" : ranked[0].name + " hat"} am meisten getrunken!` : "Alle Rennen gelaufen",
        sub: Party.ranking(g) }),
    });
  </script>
</body>
</html>
