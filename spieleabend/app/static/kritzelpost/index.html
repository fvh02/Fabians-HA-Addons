<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Kritzelpost</title>
  <link rel="stylesheet" href="../static/common.css">
  <script src="../static/common.js"></script>
  <script src="../static/art.js"></script>
  <style>
    .card.k1 { --c1: #f472b6; --c2: #9d174d; } .card.k2 { --c1: #60a5fa; --c2: #1e40af; }
    .card.k3 { --c1: #34d399; --c2: #065f46; } .card.k4 { --c1: #fbbf24; --c2: #92400e; }

    #table { align-items: center; }
    #table > * { width: 100%; max-width: 860px; }
    .topbar .timer {
      font-family: ui-monospace, monospace; font-weight: 800; padding: 5px 12px; border-radius: 999px; flex: none;
      background: var(--glass-strong); border: 1px solid var(--glass-border); min-width: 64px; text-align: center;
    }
    .timer.low { color: #fff; background: linear-gradient(135deg, #f97316, #ef4444); border-color: transparent; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }

    /* who is done */
    .crew { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .crew .who { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); width: 58px; }
    .crew .who .avatar { transition: transform .3s cubic-bezier(.3,.9,.3,1.4), opacity .3s; }
    .crew .who:not(.done) .avatar { opacity: .55; }
    .crew .who.done .avatar { transform: scale(1.08); box-shadow: 0 0 0 2px var(--ok); }
    .crew .who .tick {
      position: absolute; top: -4px; right: 8px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ok); color: #fff; font-size: .62rem; font-weight: 900; transform: scale(0); transition: transform .3s cubic-bezier(.3,.9,.3,1.6);
    }
    .crew .who.done .tick { transform: scale(1); }
    .crew .who span:last-child { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* work area */
    .work { border-radius: 28px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; animation: rise .45s ease both; }
    .work h2 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.75rem); letter-spacing: -.02em; text-align: center; }
    .work .hint { color: var(--muted); margin: -8px 0 0; text-align: center; font-size: .92rem; }
    .prompt {
      max-width: 620px; text-align: center; font-size: clamp(1.15rem, 3.6vw, 1.5rem); font-weight: 750; line-height: 1.3;
      padding: 16px 22px; border-radius: 20px; color: #3b1d4a;
      background: linear-gradient(160deg, #fff7d6, #ffe9a8); box-shadow: 0 10px 26px rgba(120, 80, 0, .18);
      transform: rotate(-1.2deg); animation: flipin .7s cubic-bezier(.3,.9,.3,1.2) both;
    }
    .prompt small { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .55; margin-bottom: 4px; }
    @keyframes flipin { from { transform: perspective(700px) rotateY(90deg) scale(.9); opacity: 0; } 60% { transform: perspective(700px) rotateY(-10deg) rotate(-1.2deg); opacity: 1; } }
    .write-row { width: 100%; max-width: 620px; display: flex; gap: 10px; }
    .write-row input { flex: 1; min-width: 0; font-size: 1.05rem; padding: 14px 16px; }
    .ideas { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 620px; }
    .ideas button { border: 1px dashed var(--glass-border); background: var(--glass); border-radius: 999px; padding: 6px 12px; font-size: .85rem; color: var(--muted); }
    .ideas button:hover { color: var(--text); border-color: var(--accent); }

    .paper {
      width: 100%; max-width: 760px; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; position: relative;
      background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 16px 40px rgba(30, 20, 80, .25);
    }
    .work .paper { max-width: max(300px, min(760px, calc((100dvh - 330px) * 4 / 3))); }
    .paper canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    .paper.readonly canvas { cursor: default; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; max-width: 760px; }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px 10px; border-radius: 18px; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); box-shadow: 0 2px 6px rgba(0,0,0,.2); padding: 0; transition: transform .15s; }
    .swatch:hover { transform: scale(1.12); }
    .swatch.on { transform: scale(1.18); box-shadow: 0 0 0 3px var(--accent), 0 4px 10px rgba(0,0,0,.25); }
    .sizes, .acts { display: flex; gap: 6px; padding: 6px 8px; border-radius: 18px; align-items: center; }
    .tool { width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: none; display: grid; place-items: center; font-size: 1.1rem; }
    .tool:hover { background: var(--glass-strong); }
    .tool.on { background: var(--glass-strong); border-color: var(--accent); }
    .tool i { display: block; border-radius: 50%; background: var(--text); }
    .submit-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .work.locked .paper::after, .work.locked .write-row::after {
      content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.35); pointer-events: all;
    }
    .work.locked .write-row { position: relative; }
    .work.locked .tools, .work.locked .ideas { opacity: .4; pointer-events: none; }
    .done-banner { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ok); }
    .waiting { text-align: center; padding: 40px 10px; color: var(--muted); }
    .waiting .big { font-size: 3rem; animation: bob 2s ease-in-out infinite; }

    /* reveal */
    .album { border-radius: 28px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; }
    .album header { text-align: center; }
    .album header .label { margin: 0; }
    .album header h2 { margin: 2px 0 0; font-size: clamp(1.3rem, 4vw, 1.8rem); letter-spacing: -.02em; }
    .entries { display: flex; flex-direction: column; gap: 14px; }
    .entry { display: flex; gap: 10px; align-items: flex-start; animation: flipin .7s cubic-bezier(.3,.9,.3,1.2) both; }
    .entry:nth-child(even) { flex-direction: row-reverse; }
    .entry .body { display: flex; flex-direction: column; gap: 4px; max-width: min(560px, 82%); }
    .entry:nth-child(even) .body { align-items: flex-end; }
    .entry .by { font-size: .78rem; color: var(--muted); font-weight: 650; padding: 0 6px; }
    .bubble {
      padding: 12px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: 650; line-height: 1.35;
      background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    }
    .entry:nth-child(odd) .bubble { border-top-left-radius: 6px; }
    .entry:nth-child(even) .bubble { border-top-right-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; }
    .bubble.empty-text { font-style: italic; opacity: .7; }
    .entry .paper { width: min(460px, 76vw); border-radius: 18px; }
    .entry .late { font-size: .72rem; color: var(--muted); padding: 0 6px; }
    .reveal-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .reveal-bar .pos { color: var(--muted); font-size: .85rem; min-width: 90px; text-align: center; }
    @media (max-width: 560px) {
      .work, .album { padding: 16px 10px; border-radius: 22px; }
      .swatch { width: 24px; height: 24px; }
      .tool { width: 36px; height: 36px; }
    }
    /* ---------- one screen, no scrolling: the work area / album gets what is left ---------- */
    #table { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; } /* entry animations never make the page scroll */
    #table > .topbar, #crew { flex: none; }
    #stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .work, .album { flex: 1 1 auto; min-height: 0; }
    .work { justify-content: center; gap: clamp(8px, 1.8vh, 16px); }
    .work > * { flex: none; }
    .work .hint { margin: 0; }
    /* the drawing takes all remaining height and keeps 4:3 */
    .work > .pbox { flex: 1 1 0; min-height: 120px; width: 100%; container-type: size; display: grid; place-items: center; }
    .work .pbox .paper { width: min(100cqw, calc(100cqh * 4 / 3), 760px); max-width: none; }
    .prompt { padding: clamp(8px, 1.6vh, 16px) 20px; font-size: clamp(1.05rem, 2.8vh, 1.5rem); }
    .crew { gap: 6px; }
    .crew .who { width: 52px; font-size: .75rem; gap: 2px; }
    .crew .who span:last-child { max-width: 52px; }
    /* many players: avatars only (names on hover) */
    .crew.many .who { width: auto; }
    .crew.many .who span:last-child { display: none; }
    .crew.many .who .tick { right: -3px; }
    .crew.many .avatar { width: 28px; height: 28px; font-size: .75rem; }
    /* album: the entries scroll inside the panel, the newest is scrolled into view */
    .album { gap: 10px; }
    .album header, .reveal-bar { flex: none; }
    .album header h2 { font-size: clamp(1.15rem, 3.2vh, 1.8rem); }
    .entries { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; container-type: size; padding: 2px 2px 6px; gap: 10px; }
    .entry { flex: none; }
    .entry .paper { width: min(460px, 76cqw, calc(72cqh * 4 / 3)); flex: none; }
    .entry .bubble { font-size: 1.02rem; padding: 10px 14px; }
    .reveal-bar { gap: 8px; }
    .reveal-bar .pos { min-width: 0; }
    @media (max-width: 560px) {
      .work, .album { padding: 12px 10px; }
      .tools { gap: 6px; }
      .swatches { display: grid; grid-template-columns: repeat(7, 24px); gap: 6px; padding: 6px 8px; }
      .sizes, .acts { padding: 4px 6px; gap: 4px; }
      .reveal-bar { gap: 6px; }
      .reveal-bar .btn { padding: 10px 11px; font-size: .9rem; }
      .write-row input { padding: 12px 14px; }
    }
    @media (max-height: 700px) {
      .crew .who { font-size: .75rem; }
      .crew .avatar { width: 28px; height: 28px; font-size: .75rem; }
      .ideas button { padding: 5px 10px; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Kritzelpost</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <span class="timer hidden" id="timer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div class="crew" id="crew"></div>
    <div id="stage"></div>
  </section>

  <script>
    const $ = id => document.getElementById(id);
    const send = msg => Shell.send(msg);
    const esc = s => Shell.esc(s);
    const W = 1000, H = 750, SCALE = 1.5;
    const COLORS = ["#111827", "#6b7280", "#ef4444", "#f97316", "#facc15", "#22c55e", "#0d9488",
                    "#38bdf8", "#2563eb", "#8b5cf6", "#ec4899", "#92400e", "#fcd5b5", "#ffffff"];
    const SIZES = [4, 10, 22, 44];

    window.GAME = {
      kind: "kritzelpost",
      title: "Kritzelpost",
      minPlayers: 3,
      art: "kritzelpost",
      fan: [["k1", "✏️"], ["k2", "🖼️"], ["k3", "💬"], ["k4", "🎨"]]
        .map(([c, e]) => Shell.card(c, `<span class="emo">${e}</span>`)).join(""),
      settings: [{ key: "tempo", label: "Tempo", options: [
        [2, "Normales Tempo"], [1, "Schnell"], [3, "Gemütlich"], [0, "Ohne Zeitlimit"]] }],
      render: () => render(),
      finished: () => ({
        icon: "🎨",
        title: "Das waren alle Alben!",
        sub: Shell.game.host === Shell.me ? "Noch eine Runde?" : '<p class="empty">Der Gastgeber kann ein neues Spiel starten.</p>',
      }),
      onError: () => { submitting = false; },
    };

    // ---------- drawing ----------
    function strokePath(ctx, s, upto) {
      const p = s.p, n = upto == null ? p.length : Math.min(p.length, upto);
      if (n < 2) return;
      ctx.strokeStyle = ctx.fillStyle = s.c;
      ctx.lineWidth = s.w;
      if (n === 2) { ctx.beginPath(); ctx.arc(p[0], p[1], s.w / 2, 0, Math.PI * 2); ctx.fill(); return; }
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < n; i += 2) ctx.lineTo(p[i], p[i + 1]);
      ctx.stroke();
    }
    function setupCanvas(canvas) {
      canvas.width = W * SCALE; canvas.height = H * SCALE;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
      ctx.lineCap = ctx.lineJoin = "round";
      return ctx;
    }
    function paint(ctx, strokes) {
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      for (const s of strokes) strokePath(ctx, s);
    }
    /* Re-draw a finished drawing stroke by stroke, as if someone was drawing it. */
    function replay(canvas, strokes, ms = 2200) {
      const ctx = setupCanvas(canvas);
      paint(ctx, []);
      const total = strokes.reduce((n, s) => n + s.p.length, 0);
      if (!total || ms <= 0 || matchMedia("(prefers-reduced-motion: reduce)").matches) { paint(ctx, strokes); return; }
      const t0 = performance.now();
      (function frame(now) {
        if (!canvas.isConnected) return;
        let budget = Math.ceil(total * Math.min(1, (now - t0) / ms));
        paint(ctx, []);
        for (const s of strokes) {
          if (budget <= 0) break;
          strokePath(ctx, s, budget);
          budget -= s.p.length;
        }
        if (now - t0 < ms) requestAnimationFrame(frame);
      })(t0);
    }

    // ---------- state of my current task ----------
    let workKey = null;       // code|step: rebuilt only when this changes
    let strokes = [], text = "";
    let color = COLORS[0], size = SIZES[1], eraser = false;
    let endAt = null, autoSent = null, submitting = false;
    let shownAlbum = null, shownCount = 0;

    const store = Shell.store;
    function saveDraft() {
      if (!workKey) return;
      try { store.set("kritzel-draft", JSON.stringify({ key: workKey, strokes, text })); } catch {}
    }
    function loadDraft(key) {
      try {
        const d = JSON.parse(store.get("kritzel-draft") || "null");
        if (d && d.key === key) return d;
      } catch {}
      return null;
    }

    function render() {
      const g = Shell.game, me = Shell.me;
      $("tableCode").textContent = `Code ${g.code}`;
      $("leaveGame").onclick = Shell.leaveGame;
      if (g.state === "playing" && g.phase === "play") renderPlay(g, me);
      else renderReveal(g, me);
    }

    function renderCrew(g) {
      $("crew").classList.toggle("many", g.players.length > 6);
      $("crew").innerHTML = g.players.map(p => `
        <div class="who ${p.done ? "done" : ""}">${Shell.avatar(p)}<span class="tick">✓</span><span>${esc(p.name)}</span></div>`).join("");
    }

    function renderPlay(g, me) {
      shownAlbum = null;
      renderCrew(g);
      const kind = g.step_kind;
      const mine = g.players.find(p => p.id === me);
      const label = { write: "Schreiben", draw: "Zeichnen", describe: "Beschreiben" }[kind];
      $("tableCode").textContent = `Code ${g.code} · ${label} ${g.step + 1}/${g.steps}`;
      endAt = g.remaining == null ? null : Date.now() + g.remaining * 1000;
      tick();

      const key = `${g.code}|${g.step}|${g.album}`;
      if (key !== workKey) {
        workKey = key;
        submitting = false;
        const draft = loadDraft(key);
        strokes = draft ? draft.strokes : [];
        text = draft ? draft.text : "";
        buildWork(g, kind);
      }
      const done = !!(mine && mine.done);
      const work = document.querySelector(".work");
      if (work) {
        work.classList.toggle("locked", done);
        $("submitBtn").classList.toggle("hidden", done);
        $("editBtn").classList.toggle("hidden", !done);
        $("doneBanner").classList.toggle("hidden", !done);
        const left = g.players.filter(p => !p.done).length;
        $("doneBanner").querySelector("span").textContent = left ? `Fertig! Warte auf ${left} Spieler …` : "Fertig!";
      }
      if (!done) submitting = false;
    }

    function buildWork(g, kind) {
      const task = g.task;
      const ideas = (g.ideas || []).map(i => `<button data-idea="${esc(i)}">💡 ${esc(i)}</button>`).join("");
      const submitRow = `
        <div class="submit-row">
          <span class="done-banner hidden" id="doneBanner">✓ <span></span></span>
          <button class="btn ghost hidden" id="editBtn">Bearbeiten</button>
          <button class="btn" id="submitBtn">Fertig</button>
        </div>`;
      let html;
      if (kind === "write") {
        html = `<h2>Schreib einen lustigen Satz</h2>
          <p class="hint">Der nächste Spieler muss ihn zeichnen.</p>
          <div class="write-row"><input id="textIn" maxlength="120" placeholder="z. B. Ein Pinguin im Urlaub" autocomplete="off"></div>
          <div class="ideas">${ideas}</div>${submitRow}`;
      } else if (kind === "draw") {
        html = `<div class="prompt"><small>Zeichne</small>${task && task.text ? esc(task.text) : "<i>(nichts geschrieben – zeichne, was du willst)</i>"}</div>
          <div class="pbox"><div class="paper" id="paper"><canvas id="pad"></canvas></div></div>
          <div class="tools">
            <div class="swatches glass">${COLORS.map(c => `<button class="swatch" data-color="${c}" style="background:${c}" title="${c}"></button>`).join("")}</div>
            <div class="sizes glass">${SIZES.map(s => `<button class="tool" data-size="${s}" title="Stärke ${s}"><i style="width:${Math.max(4, s / 2)}px;height:${Math.max(4, s / 2)}px"></i></button>`).join("")}</div>
            <div class="acts glass">
              <button class="tool" id="eraser" title="Radierer">🧽</button>
              <button class="tool" id="undo" title="Rückgängig">↶</button>
              <button class="tool" id="clear" title="Alles löschen">🗑️</button>
            </div>
          </div>${submitRow}`;
      } else {
        html = `<h2>Was ist das?</h2>
          <p class="hint">Beschreibe die Zeichnung – der nächste Spieler zeichnet deinen Satz.</p>
          <div class="pbox"><div class="paper readonly"><canvas id="view"></canvas></div></div>
          <div class="write-row"><input id="textIn" maxlength="120" placeholder="Das ist bestimmt …" autocomplete="off"></div>${submitRow}`;
      }
      $("stage").innerHTML = `<div class="work glass">${html}</div>`;

      const input = $("textIn");
      if (input) {
        input.value = text;
        input.oninput = () => { text = input.value; saveDraft(); };
        input.onkeydown = e => { if (e.key === "Enter") submit(); };
        if (matchMedia("(hover: hover)").matches) input.focus();
      }
      document.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
        text = input.value = b.dataset.idea; saveDraft(); input.focus();
      });
      if (kind === "draw") setupPad();
      if (kind === "describe") replay($("view"), task && task.strokes ? task.strokes : [], 1600);
      $("submitBtn").onclick = submit;
      $("editBtn").onclick = () => send({ t: "edit" });
    }

    function setupPad() {
      const canvas = $("pad"), ctx = setupCanvas(canvas);
      paint(ctx, strokes);
      const pick = () => {
        document.querySelectorAll(".swatch").forEach(b => b.classList.toggle("on", !eraser && b.dataset.color === color));
        document.querySelectorAll("[data-size]").forEach(b => b.classList.toggle("on", +b.dataset.size === size));
        $("eraser").classList.toggle("on", eraser);
      };
      pick();
      document.querySelectorAll(".swatch").forEach(b => b.onclick = () => { color = b.dataset.color; eraser = false; pick(); });
      document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => { size = +b.dataset.size; pick(); });
      $("eraser").onclick = () => { eraser = !eraser; pick(); };
      $("undo").onclick = () => { strokes.pop(); paint(ctx, strokes); saveDraft(); };
      $("clear").onclick = () => { if (strokes.length && confirm("Ganze Zeichnung löschen?")) { strokes = []; paint(ctx, strokes); saveDraft(); } };

      let cur = null;
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        return [Math.round((e.clientX - r.left) / r.width * W), Math.round((e.clientY - r.top) / r.height * H)];
      };
      canvas.onpointerdown = e => {
        if (document.querySelector(".work.locked")) return;
        canvas.setPointerCapture(e.pointerId);
        const [x, y] = pos(e);
        cur = { c: eraser ? "#ffffff" : color, w: eraser ? Math.max(size, 22) * 1.6 : size, p: [x, y] };
        strokePath(ctx, cur);
      };
      canvas.onpointermove = e => {
        if (!cur) return;
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = pos(ev), p = cur.p;
          const dx = x - p[p.length - 2], dy = y - p[p.length - 1];
          if (dx * dx + dy * dy < 9) continue;
          ctx.strokeStyle = cur.c; ctx.lineWidth = cur.w;
          ctx.beginPath(); ctx.moveTo(p[p.length - 2], p[p.length - 1]); ctx.lineTo(x, y); ctx.stroke();
          p.push(x, y);
        }
      };
      const end = () => {
        if (!cur) return;
        strokes.push(cur); cur = null;
        saveDraft();
      };
      canvas.onpointerup = canvas.onpointercancel = end;
    }

    function submit(auto) {
      const g = Shell.game;
      if (!g || g.phase !== "play" || submitting) return;
      const mine = g.players.find(p => p.id === Shell.me);
      if (mine && mine.done) return;
      if (g.step_kind === "draw") {
        if (!strokes.length && auto !== true && !confirm("Du hast noch nichts gezeichnet. Trotzdem abgeben?")) return;
        submitting = true;
        send({ t: "submit", strokes });
      } else {
        const value = (($("textIn") || {}).value || "").trim();
        if (!value) { if (auto !== true) Shell.toast("Schreib zuerst etwas"); return; }
        submitting = true;
        send({ t: "submit", text: value });
      }
    }

    function tick() {
      const el = $("timer");
      const g = Shell.game;
      if (!g || g.state !== "playing" || g.phase !== "play" || endAt == null) { el.classList.add("hidden"); return; }
      const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      el.classList.remove("hidden");
      el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      el.classList.toggle("low", left <= 10);
      if (left === 0 && autoSent !== workKey) { autoSent = workKey; submit(true); }
    }
    setInterval(tick, 250);

    // ---------- reveal ----------
    function renderReveal(g, me) {
      workKey = null;
      $("timer").classList.add("hidden");
      $("crew").innerHTML = "";
      const r = g.reveal;
      if (!r) { $("stage").innerHTML = `<div class="waiting glass work"><div class="big">🎨</div></div>`; return; }
      $("tableCode").textContent = `Code ${g.code} · Album ${r.album + 1}/${r.albums}`;
      const host = g.host === me;
      if (shownAlbum !== r.album || r.entries.length < shownCount || !$("entries")) {
        shownAlbum = r.album; shownCount = 0;
        $("stage").innerHTML = `
          <div class="album glass">
            <header><p class="label">Album ${r.album + 1} von ${r.albums}</p><h2>Die Geschichte von ${esc(r.owner)}</h2></header>
            <div class="entries" id="entries"></div>
            <div class="reveal-bar" id="revealBar"></div>
          </div>`;
      }
      const box = $("entries");
      for (let i = shownCount; i < r.entries.length; i++) {
        const e = r.entries[i];
        const p = g.players.find(x => x.id === e.by) || { name: e.name, bot: false };
        const late = e.late ? '<span class="late">⏱ Zeit abgelaufen</span>' : "";
        const body = e.kind === "draw"
          ? `<div class="paper readonly"><canvas></canvas></div>`
          : `<div class="bubble ${e.text ? "" : "empty-text"}">${e.text ? esc(e.text) : "(keine Idee)"}</div>`;
        box.insertAdjacentHTML("beforeend", `
          <div class="entry">${Shell.avatar({ ...p, name: e.name })}<div class="body"><span class="by">${esc(e.name)}</span>${body}${late}</div></div>`);
        const added = box.lastElementChild;
        if (e.kind === "draw") replay(added.querySelector("canvas"), e.strokes, i === r.entries.length - 1 && shownCount ? 2400 : 0);
        if (shownCount) added.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      shownCount = r.entries.length;

      const last = r.count >= r.total, lastAlbum = r.album + 1 >= r.albums;
      $("revealBar").innerHTML = g.state !== "playing" ? "" : host ? `
        <button class="btn ghost" id="rvBack" ${r.album === 0 && r.count <= 1 ? "disabled" : ""}>Zurück</button>
        <span class="pos">${r.count} / ${r.total}</span>
        ${last ? "" : '<button class="btn ghost" id="rvAll">Alles zeigen</button>'}
        <button class="btn" id="rvNext">${!last ? "Weiter" : lastAlbum ? "Fertig" : "Nächstes Album"}</button>`
        : `<span class="pos">${r.count} / ${r.total} · Der Gastgeber blättert um</span>`;
      if (host && g.state === "playing") {
        $("rvNext").onclick = () => send({ t: "next" });
        $("rvBack").onclick = () => send({ t: "back" });
        if ($("rvAll")) $("rvAll").onclick = () => send({ t: "album_all" });
      }
    }

    Shell.start(window.GAME);
  </script>
</body>
</html>
