<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Trinklotto</title>
  <link rel="stylesheet" href="../static/common.css">
  <link rel="stylesheet" href="../static/party.css">
  <script src="../static/common.js"></script>
  <script src="../static/art.js"></script>
  <script src="../static/party.js"></script>
  <style>
    .mine { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .mine div { border-radius: 18px; padding: 12px 6px; background: var(--glass-strong); border: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 750; }
    .mine small { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
    .mine .sw { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.4); }
    .mine .num { font-size: 1.9rem; font-weight: 900; line-height: 34px; }
    .mine .emo { font-size: 1.9rem; line-height: 34px; }
    .callbox { width: 100%; padding: 22px 18px; border-radius: 24px; font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 850; line-height: 1.3; color: #fff;
      background: linear-gradient(150deg, #312e81, #7c3aed 55%, #db2777); box-shadow: 0 18px 40px rgba(20, 10, 60, .35); animation: popin .6s cubic-bezier(.2,.9,.3,1.3) both; }
    .tvmain .callbox { font-size: clamp(2rem, 4.4vw, 5rem); padding: 3vw; }
    .verdict { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 900; animation: popin .6s .25s cubic-bezier(.2,.9,.3,1.3) both; }
    .verdict.drink { color: #f59e0b; } .verdict.give { color: var(--accent); } .verdict.safe { color: var(--ok); }
    .verdict small { display: block; font-size: .9rem; color: var(--muted); font-weight: 650; margin-top: 4px; }
    body:not(.tv) .stage-hit .pstage { box-shadow: 0 0 0 3px #f59e0b, var(--glass-shadow); }
    /* ---- one screen, no scrolling (page-local; same block in every drinking game) ---- */
    body:not(.tv) #table#table:not(.hidden) { height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 0; }
    body:not(.tv) #stage#stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    body:not(.tv) #stage#stage > .pstage { flex: 1 1 0; min-height: 0; gap: clamp(6px, 1.6vh, 16px); padding: clamp(10px, 1.8vh, 18px) 14px; }
    body:not(.tv) .pstage > .phead + * { margin-top: auto; }
    body:not(.tv) .pstage > :last-child { margin-bottom: auto; }
    body:not(.tv) .pstage .plabel { margin: 0 0 -2px; }
    .topbar .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pctl { flex-wrap: nowrap; width: 100%; max-width: 420px; }
    .pctl .btn { flex: 1 1 auto; min-height: 44px; padding: 10px; font-size: .95rem; white-space: nowrap; }
    .pctl .btn.small { flex: 0 1 auto; min-height: 40px; }
    /* scores: compact rows, two columns from 5 players on; shrinks (and scrolls) only as a last resort */
    .pstage .pscore, #finished .pscore { gap: 5px; }
    body:not(.tv) .pstage .pscore { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
    .pstage .pscore:has(.ps:nth-child(5)), #finished .pscore:has(.ps:nth-child(6)) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pstage .pscore .ps, #finished .pscore .ps { padding: 4px 9px; gap: 7px; border-radius: 12px; }
    .pstage .pscore .avatar, #finished .pscore .avatar { width: 26px; height: 26px; font-size: .75rem; }
    .pstage .pscore .pos, #finished .pscore .pos { width: auto; min-width: 12px; font-size: .78rem; }
    .pstage .pscore .pts, #finished .pscore .pts { min-width: 16px; }
    .pstage .pscore:has(.ps:nth-child(5)) .ps { gap: 5px; padding: 4px 7px; font-size: .9rem; }
    .pstage .pscore .plus { font-size: .78rem; }
    body:not(.tv) .pstage .pscore:has(.ps:nth-child(7)) .ps { padding-top: 2px; padding-bottom: 2px; }
    body:not(.tv) .pstage .pscore:has(.ps:nth-child(7)) .avatar { width: 22px; height: 22px; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) { gap: 4px 8px; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) .d { font-size: .8rem; }
    #finished .panel { max-height: calc(100dvh - 32px); overflow-y: auto; }
    #finished .trophy { font-size: 2.8rem; }
    body:not(.tv) .drinkers { gap: 6px 10px; }
    body:not(.tv) .drinkers .d { gap: 3px; font-size: .9rem; }
    body:not(.tv) .drinkers .avatar { width: clamp(34px, 6.4vh, 54px); height: clamp(34px, 6.4vh, 54px); font-size: 1.05rem; }
    body:not(.tv) .drinkers:has(.d:nth-child(6)) .avatar { width: 28px; height: 28px; font-size: .8rem; }
    body:not(.tv) .pbanner { font-size: clamp(1.25rem, 3.4vh, 2.1rem); }
    /* game (phones) */
    body:not(.tv) .callbox { padding: clamp(12px, 2.4vh, 22px) 16px; font-size: clamp(1.1rem, 3.2vh, 1.9rem); }
    body:not(.tv) .verdict { font-size: clamp(1.25rem, 3.6vh, 2.4rem); line-height: 1.2; }
    body:not(.tv) .verdict small { font-size: .85rem; margin-top: 2px; }
    body:not(.tv) .mine { gap: 8px; }
    body:not(.tv) .mine div { flex-direction: row; justify-content: center; gap: 6px; padding: clamp(5px, 1.2vh, 12px) 6px; border-radius: 14px; font-size: .9rem; flex-wrap: wrap; }
    body:not(.tv) .mine small { display: none; }
    body:not(.tv) .mine .sw { width: 22px; height: 22px; }
    body:not(.tv) .mine .num, body:not(.tv) .mine .emo { font-size: 1.4rem; line-height: 26px; }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Trinklotto</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div id="stage"></div>
  </section>
  <script>
    const esc = s => Shell.esc(s);
    Party.start({
      kind: "trinklotto", title: "Trinklotto", art: "trinklotto", minPlayers: 2, timerPhases: ["reveal"], icon: "🎲", drink: true,
      nextLabel: "Nächste Ansage →",
      head: g => `Ansage ${g.round} / ${g.rounds}`,
      settings: [
        { key: "rounds", label: "Ansagen", options: [[20, "20 Ansagen"], [10, "10 Ansagen"], [30, "30 Ansagen"], [50, "50 Ansagen"]] },
        { key: "seconds", label: "Tempo", options: [[0, "Gastgeber tippt weiter"], [15, "Automatisch alle 15 s"], [25, "Automatisch alle 25 s"], [40, "Automatisch alle 40 s"]] },
      ],
      build(g, ctx) {
        const c = g.call, hit = c.hits.includes(Shell.me), m = g.mine;
        const hitPlayers = c.hits.map(id => g.players.find(p => p.id === id)).filter(Boolean);
        document.body.classList.toggle("stage-hit", hit && c.kind === "drink");
        const verdict = ctx.tv ? "" : c.kind === "shuffle" ? `<div class="verdict give">🔀 Deine neuen Eigenschaften:</div>`
          : hit ? (c.kind === "give" ? `<div class="verdict give">🎁 Du verteilst ${c.n}!<small>Such dir aus, wer trinkt.</small></div>`
                                     : `<div class="verdict drink">🍺 Du trinkst ${c.n}!</div>`)
          : `<div class="verdict safe">😇 Glück gehabt</div>`;
        const mine = m && !ctx.tv ? `<div class="mine"><div><small>Farbe</small><span class="sw" style="background:${m.hex}"></span>${esc(m.color)}</div>
          <div><small>Zahl</small><span class="num">${m.number}</span>&nbsp;</div><div><small>Tier</small><span class="emo">${m.emoji}</span>${esc(m.animal)}</div></div>` : "";
        return `<div class="callbox">${esc(c.text)}</div>${verdict}${mine}
          ${hitPlayers.length && c.kind !== "shuffle" ? `<div class="drinkers">${hitPlayers.map((p, i) => `<div class="d" style="animation-delay:${200 + i * 80}ms">${Shell.avatar(p)}<span>${p.id === Shell.me ? "Du" : esc(p.name)}</span></div>`).join("")}</div>` : ""}
          ${ctx.tv ? "" : `<h3 class="plabel" style="align-self:flex-start">Schlucke bisher</h3>${Party.ranking(g, { gained: true })}`}`;
      },
      celebrate: () => false,
      finished: (g, ranked) => ({ icon: "🎲", title: ranked[0] && ranked[0].score ? `${ranked[0].id === Shell.me ? "Du hattest" : ranked[0].name + " hatte"} das meiste Pech!` : "Spiel beendet", sub: Party.ranking(g) }),
    });
  </script>
</body>
</html>
