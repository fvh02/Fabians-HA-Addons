<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Farbrausch</title>
  <link rel="stylesheet" href="../static/common.css">
  <script src="../static/common.js"></script>
  <style>
    /* card faces: fully coloured with a white oval, like a classic colour card game */
    .card.cr { --c1: #fb7185; --c2: #be123c; } .card.cy { --c1: #fcd34d; --c2: #d97706; }
    .card.cg { --c1: #4ade80; --c2: #15803d; } .card.cb { --c1: #60a5fa; --c2: #1d4ed8; }
    .card.cw { --c1: #a78bfa; --c2: #1e1b3a; }
    .card.fr .front { background: linear-gradient(150deg, var(--c1), var(--c2)); border-color: rgba(255,255,255,.55); }
    .card.fr .front::after {
      inset: 13% 9%; border-radius: 50%; transform: rotate(-28deg);
      background: rgba(255,255,255,.94); box-shadow: inset 0 2px 6px rgba(0,0,0,.12);
    }
    .card.fr .v { font-size: calc(var(--w) * .42); filter: none; }
    .card.fr .v.sym { font-size: calc(var(--w) * .46); }
    .card.fr .v.small { font-size: calc(var(--w) * .34); letter-spacing: -.06em; }
    .card.fr .mid { position: relative; z-index: 1; display: grid; place-items: center; }
    .card.fr .mid svg { width: calc(var(--w) * .5); height: calc(var(--w) * .5); stroke: var(--c2); }
    .card.fr .ico svg { width: calc(var(--w) * .19); height: calc(var(--w) * .19); stroke: #fff; display: block; }
    .card.fr .tl, .card.fr .br { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); font-size: calc(var(--w) * .17); }
    .card.cw .front { background: linear-gradient(150deg, #312e81, #0f0a1e); }
    .card.cw .front::after { background: conic-gradient(from 0deg, #f43f5e 0 25%, #facc15 0 50%, #22c55e 0 75%, #3b82f6 0); }
    .card.cw .v { background: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
    .card .back {
      background:
        radial-gradient(ellipse 34% 46% at 50% 50%, rgba(255,255,255,.95) 0 60%, transparent 62%),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px),
        linear-gradient(145deg, #1e1b3a, #4c1d95 60%, #be185d);
    }
    .card .back span {
      background: linear-gradient(135deg, #f43f5e, #f59e0b 35%, #22c55e 65%, #3b82f6);
      -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
      font-size: calc(var(--w) * .17); transform: rotate(-28deg);
    }

    /* opponents */
    .opp .mini-fan { display: flex; height: 40px; align-items: flex-end; padding-left: 10px; }
    .opp .mini-fan .card { --cw: 24px; margin-left: -12px; }
    .opp .mini-fan .card .back span { display: none; }
    .opp .cnt { font-weight: 800; font-size: .85rem; color: var(--muted); margin-left: auto; }
    .badge-last {
      font-size: .66rem; font-weight: 850; color: #fff; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
      background: linear-gradient(135deg, #f59e0b, #ef4444); animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.1); } }

    /* table */
    .center { --cw: clamp(64px, 15vw, 96px); }
    .pile-wrap { position: relative; display: grid; place-items: center; }
    .deck { cursor: default; }
    .deck.can { cursor: pointer; }
    .deck.can .card:last-child { animation: glow 1.4s ease-in-out infinite; border-radius: calc(var(--w) * .16); }
    .colorring {
      position: absolute; inset: -12px; border-radius: 22px; pointer-events: none;
      box-shadow: 0 0 0 4px var(--ring), 0 0 26px var(--ring); transition: box-shadow .4s;
    }
    .dir { font-size: 1.6rem; color: var(--muted); transition: transform .5s cubic-bezier(.3,.9,.3,1.3); }
    .dir.ccw { transform: scaleX(-1); }
    .pending { font-weight: 850; color: #fff; background: linear-gradient(135deg, #f97316, #ef4444); padding: 4px 12px; border-radius: 999px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 0; }
    .btn.last { background: linear-gradient(135deg, #f59e0b, #ef4444); animation: pulse 1s ease-in-out infinite; }
    .btn.catch { background: linear-gradient(135deg, #0ea5e9, #6366f1); }

    /* my hand */
    .me .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .me .head b { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .me .head span { font-size: .9rem; color: var(--muted); }
    .hand { display: flex; padding: 16px 10px 8px; overflow-x: auto; --cw: clamp(56px, 13vw, 84px); }
    /* centred while it fits, scrollable from the first card when it doesn't */
    .hand::before, .hand::after { content: ""; margin: auto; }
    .hand .card { margin-left: calc(var(--cw) * var(--overlap, -.28)); transition: transform .2s cubic-bezier(.3,.9,.3,1.3), filter .2s; }
    .hand .card:first-child { margin-left: 0; }
    .hand.turn .card:not(.ok) { filter: saturate(.45) brightness(.82); }
    .hand .card.ok { cursor: pointer; }
    .hand .card.ok:hover, .hand .card.ok:focus-visible { transform: translateY(-14px) rotate(-2deg); z-index: 3; }
    .hand .card.ok .face { box-shadow: 0 0 0 2px var(--ok), 0 8px 20px rgba(16, 185, 129, .35); }
    .hand .card.fresh .face { box-shadow: 0 0 0 3px #facc15, 0 8px 22px rgba(250, 204, 21, .45); }

    /* colour picker */
    .picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 16px auto 4px; max-width: 260px; }
    .picker button {
      aspect-ratio: 1; border: 0; border-radius: 26px; color: #fff; font-weight: 800; font-size: 1.05rem;
      box-shadow: 0 10px 24px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.4); transition: transform .15s;
    }
    .picker button:hover { transform: scale(1.06); }
    .picker [data-color=r] { background: linear-gradient(145deg, #fb7185, #be123c); }
    .picker [data-color=y] { background: linear-gradient(145deg, #fcd34d, #d97706); }
    .picker [data-color=g] { background: linear-gradient(145deg, #4ade80, #15803d); }
    .picker [data-color=b] { background: linear-gradient(145deg, #60a5fa, #1d4ed8); }

    .scores { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: .95rem; }
    .scores th { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; padding: 6px; text-align: right; }
    .scores th:first-child, .scores td:first-child { text-align: left; }
    .scores td { padding: 8px 6px; border-top: 1px solid var(--glass-border); text-align: right; }
    .scores tr.best td { font-weight: 800; }
    @media (max-width: 560px) { .hand { --overlap: -.42; } }
  </style>
</head>
<body>
  <section id="table" class="hidden">
    <div class="topbar glass">
      <span class="title">Farbrausch</span>
      <span class="code" id="tableCode"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="leaveGame" style="padding:7px 14px">Verlassen</button>
    </div>
    <div class="opponents" id="opponents"></div>
    <div class="felt glass">
      <div class="center" id="center"></div>
      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="me glass" id="me"></div>
  </section>

  <div class="overlay hidden" id="colorPick">
    <div class="panel glass">
      <h3 style="font-size:1.4rem">Welche Farbe wünschst du dir?</h3>
      <div class="picker">
        <button data-color="r">Rot</button><button data-color="y">Gelb</button>
        <button data-color="g">Grün</button><button data-color="b">Blau</button>
      </div>
      <button class="btn ghost" id="pickCancel" style="margin-top:10px">Abbrechen</button>
    </div>
  </div>

  <div class="overlay hidden" id="roundEnd">
    <div class="panel glass" style="max-width:440px">
      <h3 id="roundTitle" style="font-size:1.5rem;margin:4px 0"></h3>
      <div id="roundTable"></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="nextRound">Nächste Runde</button>
      </div>
      <p class="empty" id="roundWait"></p>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const send = msg => Shell.send(msg);
    const esc = s => Shell.esc(s);
    const RING = { r: "#f43f5e", y: "#f59e0b", g: "#22c55e", b: "#3b82f6" };
    const COLOR_NAME = { r: "Rot", y: "Gelb", g: "Grün", b: "Blau" };
    const SYM = { skip: "", rev: "", "+2": "+2", wild: "", "+4": "+4" };
    const ICON = {
      skip: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg>',
      rev: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg>',
    };
    let before = {}, lastSeq = null, lastHand = new Set(), pickFor = null;

    function cardHtml(c, cls = "", attrs = "") {
      if (!c) return Shell.card(`facedown ${cls}`, "", attrs, "", "FARB<br>RAUSCH");
      const sym = SYM[c.v] !== undefined ? SYM[c.v] : c.v;
      if (ICON[c.v]) return Shell.card(`fr c${c.c} ${cls}`,
        `<span class="tl ico">${ICON[c.v]}</span><span class="mid">${ICON[c.v]}</span><span class="br ico">${ICON[c.v]}</span>`, attrs);
      const corner = c.v === "wild" ? "★" : sym;
      const vcls = sym.length > 1 ? "small" : "";
      return Shell.card(`fr c${c.c} ${cls}`,
        `<span class="tl">${corner}</span><span class="v ${vcls}">${sym}</span><span class="br">${corner}</span>`, attrs);
    }

    window.GAME = {
      kind: "farbrausch",
      title: "Farbrausch",
      fan: [{ c: "r", v: "7" }, { c: "y", v: "rev" }, { c: "g", v: "+2" }, { c: "w", v: "+4" }].map(c => cardHtml(c)).join(""),
      settings: [
        { key: "target", label: "Spiellänge", options: [[0, "Eine Runde"], [200, "Bis 200 Punkte"], [500, "Bis 500 Punkte"]] },
        { key: "stacking", label: "Plus-Karten stapeln", options: [[0, "Ohne Stapeln"], [1, "+2 / +4 stapeln erlaubt"]] },
      ],
      render: fromServer => { if (fromServer) remember(); showTable(); if (fromServer) animate(); },
      finished: () => {
        const g = Shell.game, mine = g.players.find(p => p.id === Shell.me);
        return {
          title: g.winner ? (mine && g.winner === mine.name ? "Du hast gewonnen!" : `${g.winner} gewinnt!`) : "Spiel beendet",
          sub: (g.settings.target ? scoreTable(g) : "") + (g.host === Shell.me ? "" : '<p class="empty">Der Gastgeber kann ein neues Spiel starten.</p>'),
        };
      },
    };

    function remember() {
      before = {};
      document.querySelectorAll("[data-key]").forEach(el => { before[el.dataset.key] = Shell.rect(el); });
    }

    function scoreTable(g) {
      const rs = g.round_scores || {};
      const ranked = [...g.players].sort((a, b) => b.total - a.total);
      return `<table class="scores"><tr><th>Spieler</th><th>Rest</th><th>Punkte</th></tr>
        ${ranked.map((p, i) => `<tr class="${i === 0 ? "best" : ""}"><td>${rs.winner === p.id ? "🏆 " : ""}${esc(p.name)}</td>
          <td>${rs.left && p.id in rs.left ? rs.left[p.id] : "–"}</td><td>${p.total}</td></tr>`).join("")}</table>`;
    }

    function showTable() {
      const g = Shell.game, me = Shell.me;
      const playing = g.state === "playing" && g.phase === "turn";
      const myTurn = playing && g.turn === me;
      const cur = g.players.find(p => p.id === g.turn);
      $("tableCode").textContent = `Code ${g.code}` + (g.settings.target ? ` · Runde ${g.round}` : "");

      // opponents (in playing order, starting after me)
      const idx = g.players.findIndex(p => p.id === me);
      const order = g.players.map((_, i) => g.players[(Math.max(idx, 0) + i) % g.players.length]).filter(p => p.id !== me);
      $("opponents").innerHTML = order.map(p => `
        <div class="opp glass ${g.turn === p.id ? "turn" : ""}" data-key="o${p.id}" id="o${p.id}">
          <div class="head">${Shell.avatar(p)}<span class="n">${esc(p.name)}</span>
            ${p.called ? '<span class="badge-last">Letzte!</span>' : g.turn === p.id && playing ? '<span class="thinking"><i></i><i></i><i></i></span>' : ""}</div>
          <div class="mini-fan">${Array.from({ length: Math.min(p.count, 8) }, () => cardHtml(null)).join("")}
            <span class="cnt">${p.count} ${p.count === 1 ? "Karte" : "Karten"}</span></div>
          ${g.settings.target ? `<div class="empty" style="font-size:.75rem;margin-top:6px">${p.total} Punkte</div>` : ""}
        </div>`).join("");

      // centre
      const canDraw = myTurn && g.drawn === null;
      $("center").innerHTML = `
        <div class="pile-wrap deck ${canDraw ? "can" : ""}" id="deck" data-key="deck" title="Karte ziehen">
          ${cardHtml(null, "", 'style="position:absolute;transform:translate(5px,5px) rotate(3deg);opacity:.6"')}
          ${cardHtml(null, "", 'style="position:absolute;transform:translate(2px,3px) rotate(1.5deg);opacity:.8"')}
          ${cardHtml(null)}
        </div>
        <div class="dir ${g.direction < 0 ? "ccw" : ""}" title="Spielrichtung">↻</div>
        <div class="pile-wrap" id="discard" data-key="discard" style="--ring:${RING[g.color] || "transparent"}">
          ${cardHtml(g.top)}<div class="colorring"></div>
        </div>`;

      // status line
      let status = "", mine = false;
      if (g.phase === "round_end" || g.state === "finished") status = "Runde vorbei";
      else if (myTurn) {
        mine = true;
        status = g.pending ? `Du musst ${g.pending} Karten ziehen – oder eine Plus-Karte drauflegen`
          : g.drawn !== null ? "Die gezogene Karte passt – spielen oder behalten?"
          : g.hand.some(c => c.ok) ? `Du bist dran · Farbe: ${COLOR_NAME[g.color]}` : "Keine Karte passt – ziehe eine Karte";
      } else if (cur) status = `${cur.name} ist dran` + (g.pending ? ` · muss ${g.pending} ziehen` : "");
      $("status").textContent = status;
      $("status").classList.toggle("mine", mine);

      // buttons: pass, last card, catch
      const catchable = g.catchable && g.catchable !== me ? g.players.find(p => p.id === g.catchable) : null;
      $("actions").innerHTML = [
        myTurn && g.drawn !== null ? '<button class="btn ghost" data-act="pass">Behalten & weiter</button>' : "",
        myTurn && g.pending && !g.hand.some(c => c.ok) ? `<button class="btn" data-act="draw">${g.pending} Karten ziehen</button>` : "",
        g.can_call && playing ? '<button class="btn last" data-act="call">Letzte Karte!</button>' : "",
        catchable && playing ? `<button class="btn catch" data-catch="${catchable.id}">Erwischt! ${esc(catchable.name)} hat nicht gerufen</button>` : "",
      ].join("");
      $("log").textContent = g.log.slice(-2).join(" · ");

      // my hand
      const meP = g.players.find(p => p.id === me);
      const hand = sortHand(g.hand);
      $("me").classList.toggle("turn", myTurn);
      $("me").innerHTML = `
        <div class="head"><b>Deine Karten</b><span>${meP ? `<strong>${meP.count}</strong> ${meP.count === 1 ? "Karte" : "Karten"}` : ""}${
          g.settings.target && meP ? ` · ${meP.total} Punkte` : ""}${meP && meP.called ? " · Letzte Karte gerufen ✓" : ""}</span></div>
        <div class="hand ${myTurn ? "turn" : ""}" id="hand">
          ${hand.map(c => cardHtml(c, `${c.ok ? "ok" : ""} ${g.drawn === c.id ? "fresh" : ""}`, `data-key="c${c.id}" data-card="${c.id}" ${c.ok ? 'tabindex="0"' : ""}`)).join("")}
        </div>`;

      // round end
      const showRound = g.state === "playing" && g.phase === "round_end";
      $("roundEnd").classList.toggle("hidden", !showRound);
      if (showRound) {
        const w = g.players.find(p => p.id === g.round_scores.winner);
        $("roundTitle").textContent = w ? (w.id === me ? "Du hast keine Karten mehr!" : `${w.name} hat keine Karten mehr!`) : "Runde vorbei";
        $("roundTable").innerHTML = scoreTable(g) + `<p class="empty">Ziel: ${g.settings.target} Punkte</p>`;
        $("nextRound").classList.toggle("hidden", g.host !== me);
        $("roundWait").textContent = g.host === me ? "" : "Warte auf den Gastgeber …";
      }
      if (!myTurn) $("colorPick").classList.add("hidden");
    }

    function sortHand(hand) {
      const order = { r: 0, y: 1, g: 2, b: 3, w: 4 }, val = v => isNaN(+v) ? { skip: 10, rev: 11, "+2": 12, wild: 13, "+4": 14 }[v] : +v;
      return [...hand].sort((a, b) => order[a.c] - order[b.c] || val(a.v) - val(b.v));
    }

    function animate() {
      const g = Shell.game, prev = Shell.prev, ev = g.last || {};
      const handIds = new Set(g.hand.map(c => c.id));
      if (!prev || ev.kind === "deal" && lastSeq !== ev.seq) {
        document.querySelectorAll("#hand .card").forEach((c, i) => { c.classList.add("deal"); c.style.animationDelay = i * 45 + "ms"; });
      } else if (ev.seq !== lastSeq) {
        const top = $("discard").querySelector(".card");
        if (ev.kind === "play") {
          const from = ev.by === Shell.me ? before["c" + ev.card.id] : before["o" + ev.by];
          if (from) { if (ev.by !== Shell.me) top.classList.add("flip"); Shell.fly(top, from); } else top.classList.add("drop");
          if (ev.victim) pulse(ev.victim, `+${ev.n}`);
        }
        if (ev.kind === "draw" && ev.by !== Shell.me) pulse(ev.by, `+${ev.n}`);
        if (ev.kind === "catch") pulse(ev.target, "Erwischt! +2");
        if (ev.kind === "call" && ev.by !== Shell.me) pulse(ev.by, "Letzte Karte!");
        if (ev.kind === "call" && ev.by === Shell.me) Shell.burst($("me"), "Letzte Karte!");
        // new cards in my hand fly in from the deck, turning over
        for (const id of handIds) if (!lastHand.has(id)) {
          const node = document.querySelector(`#hand [data-card="${id}"]`);
          if (node && before.deck) { node.classList.add("flip"); Shell.fly(node, before.deck); }
        }
      }
      if (g.state === "playing" && g.phase === "round_end" && prev && prev.phase === "turn") Shell.confetti();
      lastSeq = ev.seq; lastHand = handIds;
    }
    function pulse(pid, text) {
      const box = $("o" + pid);
      if (box) Shell.burst(box, text);
      else if (pid === Shell.me) Shell.burst($("me"), text);
    }

    // ---------- input ----------
    $("center").addEventListener("click", e => {
      const g = Shell.game;
      if (e.target.closest("#deck") && g.turn === Shell.me && g.drawn === null) send({ t: "draw" });
    });
    $("actions").addEventListener("click", e => {
      const b = e.target.closest("[data-act]"), c = e.target.closest("[data-catch]");
      if (b) send({ t: b.dataset.act });
      if (c) send({ t: "catch", id: c.dataset.catch });
    });
    function playCard(id) {
      const card = Shell.game.hand.find(c => c.id === id);
      if (!card || !card.ok) return;
      if (card.c === "w") { pickFor = id; $("colorPick").classList.remove("hidden"); return; }
      send({ t: "play", id });
    }
    $("me").addEventListener("click", e => { const n = e.target.closest("[data-card]"); if (n) playCard(+n.dataset.card); });
    $("me").addEventListener("keydown", e => { const n = e.target.closest("[data-card]"); if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); playCard(+n.dataset.card); } });
    document.querySelectorAll(".picker [data-color]").forEach(b => b.onclick = () => {
      $("colorPick").classList.add("hidden");
      if (pickFor !== null) send({ t: "play", id: pickFor, color: b.dataset.color });
      pickFor = null;
    });
    $("pickCancel").onclick = () => { pickFor = null; $("colorPick").classList.add("hidden"); };
    $("nextRound").onclick = () => send({ t: "next_round" });
    $("leaveGame").onclick = () => Shell.leaveGame();
  </script>
  <script>Shell.start(window.GAME);</script>
</body>
</html>
